<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShotForge">
<title>ShotForge – AI Video Planner &amp; Prompt Writer</title>
<style>
:root{--bg:#0b0b0d;--bg2:#101013;--panel:#151519;--panel2:#1c1c21;--line:#26262d;--line2:#33333b;--text:#efebe3;--muted:#9d978c;--faint:#6b665e;
--gold:#e0ad4f;--gold2:#f3c86f;--goldbg:rgba(224,173,79,.10);--ok:#5fbf7a;--warn:#e3a33b;--bad:#e46a5a;--r:14px;--shadow:0 10px 30px rgba(0,0,0,.35);
--c1:#e0ad4f;--c2:#6fa8dc;--c3:#c27ba0;--c4:#76c7a4;--c5:#e58f65;--c6:#a78bdb}
[data-theme=light]{--bg:#f6f4ef;--bg2:#efece5;--panel:#ffffff;--panel2:#f7f5f0;--line:#e5e1d8;--line2:#d6d1c6;--text:#1d1b17;--muted:#6f695f;--faint:#9a948a;--gold:#b7802a;--gold2:#a06d1c;--goldbg:rgba(183,128,42,.09);--shadow:0 8px 24px rgba(40,30,10,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans Devanagari",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
main,.sbody>*,.opts>*,.row>*,.grid2>*{min-width:0}
/* sidebar */
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:20px 16px;border-inline-end:1px solid var(--line);background:var(--bg2);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#8a5a17);display:grid;place-items:center;color:#1a1206;box-shadow:0 4px 14px rgba(224,173,79,.25)}
.mark svg{width:19px;height:19px;stroke-width:2.2}
.brand b{font-size:18px;letter-spacing:-.02em}.brand b span{color:var(--gold)}
.brand small{display:block;font-size:11.5px;color:var(--muted);line-height:1.25}
.titlebox input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
.titlebox input:focus{border-color:var(--gold)}
.steps{display:flex;flex-direction:column;gap:3px}
.step{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);text-align:start;width:100%}
.step:hover{background:var(--panel)}
.step.on{background:var(--panel);border-color:var(--line);color:var(--text)}
.step .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.step.on .ic{background:var(--goldbg);border-color:var(--gold);color:var(--gold)}
.step .lb{flex:1;font-weight:600;font-size:14px}
.step .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center}
.step .st.done{background:var(--ok);border-color:var(--ok);color:#06210f}
.step .st.done svg{width:12px;height:12px;stroke-width:3}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.mini{display:flex;gap:8px}
.mini select,.mini button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;font-size:13px}
.mini button{flex:0 0 40px;display:grid;place-items:center}
.pricechip{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(95,191,122,.18)}.dot.warn{background:var(--warn)}
/* mobile top/bottom */
.mtop,.mnav{display:none}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .shead{flex-wrap:wrap}.shead .sp{flex-basis:0}
 .stime{order:1}
 aside{display:none}
 .mtop{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
 .mtop .brand{padding:0}.mtop .brand small{display:none}.mtop .mark{width:30px;height:30px}
 .mtop input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px;outline:none;font-size:14px}
 .mtop select{width:62px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 4px;font-size:13px}
 .mtop .iconbtn{width:36px;height:36px}
 .mnav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .mnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:9.5px;padding:5px 0;min-width:0;line-height:1.15;text-align:center;cursor:pointer;position:relative}
 .mnav button.on{color:var(--gold)}
 .mnav button .ok{position:absolute;top:2px;inset-inline-end:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--ok)}
 main{padding-bottom:110px!important}
}
/* main */
main{padding:30px 34px 60px;max-width:1160px;width:100%}
@media(max-width:900px){main{padding:20px 14px}}
.tab{display:none;animation:fade .25s ease}.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{margin-bottom:20px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-size:28px;letter-spacing:-.02em;line-height:1.15;margin:4px 0 6px}
.sub{color:var(--muted);max-width:720px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 svg{color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid2>.card{margin-bottom:0}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 170px}
.f{margin-bottom:12px}
label,.lbl{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700}
html[dir=rtl] label,html[dir=rtl] .lbl,html[dir=rtl] .eyebrow{letter-spacing:0}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s}
[data-theme=light] input[type=text],[data-theme=light] input[type=number],[data-theme=light] select,[data-theme=light] textarea{background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldbg)}
textarea{resize:vertical;min-height:90px;line-height:1.55}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 15px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px;transition:.15s}
.btn:hover{border-color:var(--line2);transform:translateY(-1px)}
a.btn{text-decoration:none;color:inherit}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1206}
.btn.gold:hover{background:var(--gold2)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}
.iconbtn.danger:hover{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.nextbar{display:flex;justify-content:flex-end;margin-top:8px}
html[dir=rtl] .flip svg{transform:scaleX(-1)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-width:96px}
.stat b{display:block;font-size:20px;letter-spacing:-.01em}.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.pill.gold{border-color:var(--gold);color:var(--gold);background:var(--goldbg)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:14px}
.note svg{color:var(--gold);margin-top:2px}
.warnbox{display:flex;gap:9px;border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:14px}
.warnbox svg{color:var(--warn);margin-top:2px}
.empty{text-align:center;padding:46px 18px;color:var(--muted)}
.empty .big-ic{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;background:var(--goldbg);color:var(--gold)}
.empty .big-ic svg{width:26px;height:26px}
.empty h3{color:var(--text);font-size:17px;margin-bottom:4px;justify-content:center}
/* timeline */
.timeline{display:flex;gap:3px;height:38px;border-radius:10px;overflow:hidden;margin:6px 0 18px;background:var(--panel2);border:1px solid var(--line);padding:3px}
.timeline button{border:0;border-radius:7px;cursor:pointer;color:#14100a;font-weight:800;font-size:12px;min-width:18px;opacity:.85;transition:.15s}
.timeline button:hover{opacity:1;transform:translateY(-1px)}
/* scenes */
.scene{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;scroll-margin-top:90px}
.scene::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--acc,var(--gold))}
.shead{display:flex;align-items:center;gap:8px;padding:11px 14px 11px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
html[dir=rtl] .shead{padding:11px 18px 11px 14px}
.badge{min-width:34px;height:28px;border-radius:8px;background:var(--acc,var(--gold));color:#14100a;font-weight:800;display:grid;place-items:center;font-size:13px;padding:0 6px}
.stime{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.shead .sp{flex:1}
.foldbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.foldbtn:hover{color:var(--text)}.foldbtn svg{width:16px;height:16px;transition:transform .2s}
.scene.folded .foldbtn svg{transform:rotate(180deg)}
.shead .badge,.shead .stime{cursor:pointer}
.ssum{display:none;align-items:center;gap:10px;padding:10px 16px 11px 20px;cursor:pointer;min-width:0}
html[dir=rtl] .ssum{padding:10px 20px 11px 16px}
.ssum .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-size:13.5px}
.ssum .tg{display:flex;gap:6px;flex:none}
.ssum .tg span{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.ssum .tg .rk{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.ssum .tg .kp{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.scene.folded .ssum{display:flex}.scene.folded .sbody{display:none}.scene.folded .shead{border-bottom-color:transparent}
.scene.folded .shead .takes,.scene.folded .shead .iconbtn[data-act=inspire]{display:none}
@media(max-width:620px){.ssum .opn{margin-inline-start:auto}.ssum{flex-wrap:wrap}.ssum .tx{flex-basis:100%;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.ssum .tg{flex-wrap:wrap}}
.foldall{display:flex;gap:6px;align-self:center}
details.sec{margin-top:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);transition:border-color .15s}
details.sec[open]{border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;min-width:0;border-radius:11px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:hover{background:color-mix(in srgb,var(--gold) 6%,transparent)}
details.sec .sl{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);white-space:nowrap;flex:none}
details.sec .sv{flex:1;min-width:0;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:end}
details.sec .sc{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:6px;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
details.sec .sc svg{width:13px;height:13px;transform:rotate(180deg);transition:transform .2s}
details.sec[open] .sc svg{transform:none}
details.sec[open] .sv{color:var(--muted)}
details.sec .sb{padding:4px 12px 12px}
.sbody>div>details.sec:first-child{margin-top:0}
.pbox .plabel .sp{flex:1}.pbox .plabel{gap:6px}
.pbox details.sec{margin:0 0 10px}
.lintok{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);margin-top:10px}.lintok svg{width:14px;height:14px}
.ssum{transition:background .15s}.ssum:hover{background:color-mix(in srgb,var(--gold) 6%,transparent)}
.ssum .opn{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:999px;padding:4px 10px 4px 12px;white-space:nowrap}
.ssum .opn svg{width:14px;height:14px;transform:rotate(180deg);animation:nudge 1.6s ease-in-out infinite}
.ssum:hover .opn{background:var(--gold);color:#14100a}
@keyframes nudge{0%,100%{translate:0 0}50%{translate:0 2px}}
@media(prefers-reduced-motion:reduce){.ssum .opn svg{animation:none}}
.scene.folded .foldbtn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.stepper button{width:28px;height:30px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
.stepper button:hover{color:var(--text);background:var(--panel2)}
.stepper input{width:42px;border:0;background:none;text-align:center;padding:4px 0;outline:none;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper span{font-size:11.5px;color:var(--muted);padding-inline-end:8px}
.sbody{padding:16px 16px 16px 20px;display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
html[dir=rtl] .sbody{padding:16px 20px 16px 16px}
@media(max-width:1020px){.sbody{grid-template-columns:1fr}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts select{padding:8px 10px;font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;user-select:none;background:var(--bg)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--goldbg)}
.pbox{position:relative;margin-top:14px}
.prompt{background:var(--bg);border:1px dashed var(--line2);border-radius:11px;padding:12px 14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.8px}
.pbox .plabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pbox .plabel label{margin:0}
details.broll{margin-top:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
details.broll summary{cursor:pointer;padding:9px 12px;font-size:13px;font-weight:600;color:var(--gold);list-style:none;display:flex;align-items:center;gap:8px}
details.broll summary::-webkit-details-marker{display:none}
details.broll ul{padding:0 12px 6px}
details.broll li{list-style:none;font-size:13px;padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;direction:ltr;text-align:left}
details.broll li span{flex:1}
.fab{position:fixed;inset-inline-end:26px;bottom:26px;z-index:25;box-shadow:var(--shadow);display:none}
.fab.show{display:inline-flex}
@media(max-width:900px){.fab{bottom:calc(76px + env(safe-area-inset-bottom));inset-inline-end:14px}}
/* characters */
.charrow{display:grid;grid-template-columns:150px 1fr 34px 34px;gap:8px;margin-bottom:8px;align-items:center}
@media(max-width:620px){.charrow{grid-template-columns:1fr 34px 34px!important}.charrow input[data-k=desc]{grid-column:1/-1;grid-row:2}}
.avatar{display:none}
/* cost */
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.bd{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.bd span:nth-child(even){text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.rec{border:1px solid var(--gold);border-radius:var(--r);padding:16px;background:linear-gradient(135deg,var(--goldbg),transparent 70%);margin-top:16px}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}.stars i{font-style:normal;opacity:.22}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
tr.best td{background:var(--goldbg)}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
html[dir=rtl] tr.sel td:first-child{box-shadow:inset -3px 0 0 var(--gold)}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--panel2)}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
input[type=range]{width:100%;accent-color:var(--gold)}
.rangehead{display:flex;justify-content:space-between;align-items:baseline}
.rangehead b{font-variant-numeric:tabular-nums;color:var(--gold)}
/* export */
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1080px){.exgrid{grid-template-columns:1fr}}
.exgrid .card{margin:0;display:flex;flex-direction:column;gap:10px}
.exgrid .btn{justify-content:flex-start}
.gnav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;border:1px dashed var(--line2);background:none;cursor:pointer;color:var(--muted);width:100%;text-align:start;font-weight:600;font-size:14px}
.gnav:hover,.gnav.on{border-style:solid;border-color:var(--gold);color:var(--gold);background:var(--goldbg)}
.gnav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--goldbg);color:var(--gold)}
.gtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.gtools input{flex:1 1 220px;max-width:340px}
.scard .gbody p.prev{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:6px 0 0}

.vwin .vbox{width:min(1100px,100%);background:#0b0b0d;border:1px solid #26262d;border-radius:18px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:vpop .3s cubic-bezier(.2,.8,.2,1)}

.vwin .vbar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;color:#efebe3;border-bottom:1px solid #26262d}
.vwin .vbar .mark{width:26px;height:26px;border-radius:8px}.vwin .vbar .mark svg{width:15px;height:15px}
.vwin .vbar b{font-size:14px}.vwin .vbar b i{font-style:normal;color:#e0ad4f}
.vwin .vbar small{color:#9d978c;font-size:12.5px}
.vwin .vbar .x{margin-inline-start:auto;width:34px;height:34px;border-radius:9px;border:1px solid #33333b;background:#151519;color:#efebe3;font-size:18px;cursor:pointer;line-height:1}
.vwin .vbar .x:hover{border-color:#e0ad4f;color:#e0ad4f}
.vwin video{display:block;width:100%;max-height:calc(100vh - 140px);background:#000;aspect-ratio:16/9}
.wel{position:fixed;inset:0;z-index:195;display:none;place-items:center;padding:20px;background:radial-gradient(900px 500px at 50% 0%,color-mix(in srgb,var(--gold) 16%,transparent),transparent),rgba(5,5,7,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.wel.on{display:grid;animation:vfade .35s ease}
.wel .box{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55);animation:vpop .45s cubic-bezier(.2,.8,.2,1)}
.wel .lhero{border:0;border-radius:0;box-shadow:none}
.wel .in{padding:20px 24px 22px;text-align:center}
.wel .eb{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800}
.wel h2{font-size:23px;margin:6px 0 8px;letter-spacing:-.01em}
.wel p{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 18px}
.wel .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wel .btns .btn{padding:12px 20px}
@media(max-width:760px){.lhero .pl{width:48px;height:48px;inset-inline-start:12px;bottom:11px}.lhero .pl svg{width:20px;height:20px}.lhero .meta{inset-inline-start:72px;bottom:22px}.wel h2{font-size:20px}.vwin{padding:0}.vwin .vbox{border-radius:0}}
.instbtn{display:none}.instbtn.on{display:flex}
.appver{font-size:11px;color:var(--faint)}
.iosmodal{position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;padding:16px}
.iosmodal.on{display:flex}.iosmodal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:420px;width:100%;font-size:14.5px;line-height:1.6}
.iosmodal .box b{color:var(--gold)}
</style>

e Dolly Zoom","shot":"Close-up","camera":"Dolly zoom","light":"Soft studio lighting","mood":"Tense","prompt":"Dolly zoom effect on a man's face as he realizes something shocking, background stretches away while his face stays the same size, dim hallway, tense cinematic lighting, thriller mood.","subject":"a man's face as he realizes something shocking in a dim hallway"},{"id":"t5","cat":"Lighting","title":"Neon Noir","shot":"Medium shot","camera":"Static locked-off camera","light":"Neon lights reflecting on wet surfaces","mood":"Dark and ominous","prompt":"Detective in a trench coat standing in a narrow alley at night, rain falling, pink and teal neon signs reflecting on wet ground, cigarette smoke, high contrast, film noir style.","subject":"a detective in a trench coat standing in a narrow alley at night, rain falling, cigarette smoke"},{"id":"t6","cat":"Lighting","title":"God Rays in the Forest","shot":"Wide establishing shot","camera":"Slow drone flyover","light":"Volumetric god rays through mist","mood":"Dreamlike","prompt":"Sunlight beams cutting through tall pine trees in a misty forest at dawn, volumetric light rays, a deer slowly walking through the light, slow camera drift, magical and peaceful mood.","subject":"a deer slowly walking through tall pine trees in a misty forest at dawn"},{"id":"t7","cat":"Lighting","title":"Candlelit Scholar","shot":"Medium close-up","camera":"Slow dolly push-in","light":"Warm candlelight","mood":"Mysterious","prompt":"Medieval scholar writing with a quill by candlelight in a stone room, flickering warm light, deep black shadows, parchment and old books, historical drama style, intimate and mysterious.","subject":"a medieval scholar writing with a quill in a stone room full of parchment and old books"},{"id":"t8","cat":"Establishing","title":"Ancient City at Dawn","shot":"Extreme wide shot","camera":"Slow drone flyover","light":"Golden hour backlight","mood":"Epic","prompt":"Aerial establishing shot of an ancient walled city at dawn, smoke rising from chimneys, river winding through it, mountains in the background, mist in the valley, epic historical film style, slow forward drone movement.","subject":"an ancient walled city at dawn, smoke rising from chimneys, a river winding through it, mountains behind"},{"id":"t9","cat":"Establishing","title":"Earth from Orbit","shot":"Extreme wide shot","camera":"Slow pan","light":"Golden hour backlight","mood":"Awe-inspiring","prompt":"Slow cinematic shot of planet Earth from orbit, sunrise creeping over the horizon, city lights fading on the night side, thin blue atmosphere glowing, ultra realistic, awe-inspiring mood.","subject":"planet Earth from orbit, sunrise creeping over the horizon, city lights fading on the night side"},{"id":"t10","cat":"Documentary","title":"Archive Film Look","shot":"Wide establishing shot","camera":"Static locked-off camera","light":"Soft overcast daylight","mood":"Nostalgic","prompt":"Black and white archival-style footage of factory workers in the 1920s leaving work, film grain, slight flicker, scratches, slightly fast motion, authentic historical documentary look.","subject":"factory workers in the 1920s leaving work, black and white archival footage with flicker and scratches"},{"id":"t11","cat":"Documentary","title":"Lost Civilization Ruins","shot":"Wide establishing shot","camera":"Slow dolly push-in","light":"Volumetric god rays through mist","mood":"Mysterious","prompt":"Slow push-in toward giant stone ruins half-buried in the jungle, carved faces covered in moss, light rays through the canopy, mist, mysterious ancient civilization atmosphere.","subject":"giant stone ruins half-buried in the jungle, carved faces covered in moss"},{"id":"t12","cat":"Emotion","title":"The Final Look Back","shot":"Medium shot","camera":"Static locked-off camera","light":"Golden hour backlight","mood":"Melancholic","prompt":"Medium shot of a traveler at a doorway turning to look back one last time before leaving, soft backlight, dust in the air, bittersweet expression, slow motion, emotional ending shot.","subject":"a traveler at a doorway turning to look back one last time, bittersweet expression"}]};
const SCRIPTS = {"updated":"2026-11-12","scripts":[{"id":"s001","c":"history","l":"s","t":"The Library That Burned Twice","x":"Alexandria's library was not destroyed in one night. It faded over centuries. Fires, wars, and budget cuts slowly emptied its shelves. By the time the last scrolls were gone, almost no one noticed. The greatest library of the ancient world did not die in flames. It died from neglect."},{"id":"s002","c":"history","l":"s","t":"The Shortest War","x":"In 1896, Britain and Zanzibar went to war. It began at nine in the morning. By nine forty, it was over. Thirty-eight minutes. A palace in ruins, a sultan in exile, and a record that still stands today: the shortest war in recorded history."},{"id":"s003","c":"history","l":"s","t":"Rome's Concrete Secret","x":"Modern concrete cracks in decades. Roman concrete has stood for two thousand years. The secret? Volcanic ash, lime, and seawater. When cracks formed, water seeped in and new crystals grew, sealing the wound. Rome built walls that heal themselves."},{"id":"s004","c":"mystery","l":"s","t":"The Lighthouse With No Keepers","x":"December, 1900. A supply ship reaches a lighthouse on a remote Scottish island. The flag is down. The beds are unmade. The clock has stopped. Three keepers are gone, and only one coat still hangs by the door. To this day, nobody knows what happened."},{"id":"s005","c":"mystery","l":"s","t":"The Signal From Nowhere","x":"For seventy-two seconds in 1977, a radio telescope heard something. A narrow, powerful signal from deep space. An astronomer circled it in red ink and wrote one word: Wow. Scientists pointed the telescope back again and again. The signal never returned."},{"id":"s006","c":"mystery","l":"s","t":"The Door in the Basement","x":"Every house on Elm Street has a basement. Only one has a door that no key fits. The neighbors say it was there before the house was built. Last night, for the first time, someone knocked from the other side."},{"id":"s007","c":"science","l":"s","t":"Your Body Is Mostly Not You","x":"Inside your body live trillions of microbes. Bacteria in your gut help digest food, train your immune system, and may even shape your mood. You are not one organism. You are a walking ecosystem, and you have never once been alone."},{"id":"s008","c":"science","l":"s","t":"Why the Sky Is Blue","x":"Sunlight looks white, but it carries every color. When it hits our atmosphere, tiny air molecules scatter short blue waves in every direction. So wherever you look, blue light is coming at you. At sunset, light travels farther, the blue fades, and the sky burns orange."},{"id":"s009","c":"science","l":"s","t":"The Tardigrade","x":"It is smaller than a grain of sand. It can survive boiling water, deep freezing, crushing pressure, and even the vacuum of space. When life gets hard, it dries up and waits. Meet the tardigrade, the toughest animal on Earth."},{"id":"s010","c":"space","l":"s","t":"A Day Longer Than a Year","x":"On Venus, the sun rises in the west. And the planet spins so slowly that one full turn takes longer than its entire trip around the sun. On Venus, a single day outlasts a year."},{"id":"s011","c":"space","l":"s","t":"Footprints That Will Last","x":"There is no wind on the Moon. No rain. No erosion. The footprints left by astronauts in 1969 are still there, exactly as they were made. Unless a meteorite strikes them, they could last for millions of years."},{"id":"s012","c":"space","l":"s","t":"The Last Light of a Dead Star","x":"When you look at the night sky, you are looking back in time. Some of those stars burned out long ago. Their light is still traveling, still arriving, still shining for you. The universe is full of ghosts that do not know they are gone."},{"id":"s013","c":"nature","l":"s","t":"The Forest That Talks","x":"Beneath the forest floor, roots connect through a web of fungi. Through it, trees share sugar, water, and warnings. A dying tree can pass its last resources to its neighbors. The forest is not a crowd of strangers. It is a family."},{"id":"s014","c":"nature","l":"s","t":"The Octopus Escape","x":"An octopus has no bones. If its beak fits through a gap, the rest of its body can follow. In aquariums, octopuses have escaped tanks, crossed floors, and raided other exhibits at night. Then they slipped back home before morning."},{"id":"s015","c":"nature","l":"s","t":"Salmon Coming Home","x":"After years in the open ocean, salmon return to the exact river where they were born. They swim upstream against currents, waterfalls, and bears. Scientists believe they find their way by smell. Home, it turns out, has a scent."},{"id":"s016","c":"tech","l":"s","t":"The First Computer Bug","x":"In 1947, engineers found a real moth trapped inside a computer relay. They taped it into their logbook with a note: first actual case of bug being found. Programmers have been hunting bugs ever since."},{"id":"s017","c":"tech","l":"s","t":"Your Phone vs. Apollo","x":"The computer that guided Apollo 11 to the Moon had about four kilobytes of memory. The phone in your pocket has millions of times more power. We used to reach the Moon with less. Now we use more to scroll."},{"id":"s018","c":"horror","l":"s","t":"The Last Message","x":"My phone buzzed at three in the morning. A text from my sister. Don't open the door. I'm not the one knocking. I looked at the hallway. Then I remembered. My sister has been dead for two years."},{"id":"s019","c":"horror","l":"s","t":"The Mirror Delay","x":"At first I thought I was tired. My reflection blinked a little after I did. Then it smiled a little after I did. Tonight, I stopped smiling. My reflection didn't."},{"id":"s020","c":"horror","l":"s","t":"Room 0","x":"The hotel elevator has buttons for floors one through twelve. Tonight there is a new one. A single button, glowing red, marked zero. The doors close on their own. And slowly, we begin to go down."},{"id":"s021","c":"scifi","l":"s","t":"The Last Human Barista","x":"In the year 2090, robots run every café in the city. Except one. A small shop on the corner, where an old man still makes coffee by hand. People wait in line for hours. Not for the taste. For the mistake."},{"id":"s022","c":"scifi","l":"s","t":"Message From Tomorrow","x":"At 6:02, every phone on Earth received the same message. It was signed by humanity, dated one year in the future. It said only three words. Do not dig. Then the networks went silent."},{"id":"s023","c":"fantasy","l":"s","t":"The Map That Changes","x":"My grandfather left me a map that redraws itself. Every morning, a new path appears. Every night, one path disappears. This morning, it shows my own house. And a road leading out of it that was never there before."},{"id":"s024","c":"fantasy","l":"s","t":"The Dragon Who Hoarded Books","x":"Most dragons sleep on gold. Old Veyra slept on books. Thousands of them, stolen from burning cities across the kingdom. Knights came to slay her. Instead, they found a dragon who only wanted someone to read to her."},{"id":"s025","c":"motivation","l":"s","t":"One Percent","x":"You don't need a new life. You need one percent. One more page. One more push-up. One more honest conversation. One percent a day doesn't feel like much. But in a year, it changes everything."},{"id":"s026","c":"motivation","l":"s","t":"The Bamboo Lesson","x":"There is an old story about a bamboo seed. It is planted. Year one, nothing. Year two, nothing. Year three, nothing. Year four, still nothing. In year five, it grows ninety feet in weeks. It was never doing nothing. It was building roots."},{"id":"s027","c":"motivation","l":"s","t":"Start Ugly","x":"Your first video will be bad. Your first painting will be messy. Your first business idea might fail. Good. Every master you admire started ugly. The only difference is they didn't stop."},{"id":"s028","c":"travel","l":"s","t":"The Blue City","x":"High in the Rif Mountains of Morocco, there is a town painted entirely in blue. Blue walls, blue stairs, blue doors. Chefchaouen glows like a piece of sky that fell into the mountains and decided to stay."},{"id":"s029","c":"travel","l":"s","t":"Where the Sun Never Sets","x":"In northern Norway, the summer sun circles the sky and never sets. At midnight, people hike, fish, and drink coffee in golden light. Sleep feels optional. Time feels like a rumor."},{"id":"s030","c":"food","l":"s","t":"Honey Never Spoils","x":"Archaeologists opening ancient Egyptian tombs found pots of honey thousands of years old. It was still edible. Honey is so low in water and so acidic that bacteria cannot survive in it. Some sweet things really do last forever."},{"id":"s031","c":"food","l":"s","t":"The Perfect Bread","x":"Flour. Water. Salt. Time. That's all bread has ever been. For ten thousand years, humans have turned four simple things into something warm, golden, and alive. Every loaf is an ancient recipe, baked again today."},{"id":"s032","c":"ad","l":"s","t":"Morning Starts Here","x":"Before the emails. Before the traffic. Before the noise. There is this moment. The first sip. Slow, warm, and yours. Northbean Coffee. Morning starts here."},{"id":"s033","c":"ad","l":"s","t":"Built for the Rain","x":"The city doesn't stop when the storm starts. Neither do you. Waterproof, lightweight, and made to move. Stormline jackets. Built for the rain."},{"id":"s034","c":"ad","l":"s","t":"Every Step Counts","x":"Ten thousand steps sounds like a lot. But it starts with one. Tie your laces. Open the door. Go. Strydeway running shoes. Every step counts."},{"id":"s035","c":"kids","l":"s","t":"The Moon's Lost Shoe","x":"One night, the Moon lost her shoe. It fell from the sky and landed in a garden. A little girl found it, shining in the grass. She climbed the tallest tree and threw it back. That is why, on some nights, the Moon smiles a little brighter."},{"id":"s036","c":"kids","l":"s","t":"Pip the Brave Snail","x":"Pip was the slowest snail in the garden. Everyone raced past him. But when the big storm came, Pip simply tucked into his shell and waited. In the morning, he was the only one still there to see the rainbow."},{"id":"s037","c":"drama","l":"s","t":"The Last Letter","x":"For forty years, she wrote him a letter every Sunday. He never wrote back. After he died, his daughter found a box under his bed. Inside were all her letters, opened, read, and kept in order. Every single one."},{"id":"s038","c":"drama","l":"s","t":"The Seat by the Window","x":"Every morning, an old man rides the same bus and sits in the same seat by the window. One day, a young woman asks why. He says, this is where my wife sat. I still like to see what she used to see."},{"id":"s039","c":"comedy","l":"s","t":"My Smart Fridge Judges Me","x":"I bought a smart fridge. It tracks everything I eat. On day one, it suggested more vegetables. On day five, it locked the ice cream. On day ten, it emailed my mother."},{"id":"s040","c":"comedy","l":"s","t":"The Cat's Morning Routine","x":"Five a.m. The cat stares at me. Five oh one. The cat knocks a glass off the table. Five oh two. I feed the cat. Five oh three. The cat goes back to sleep. Who trained whom?"},{"id":"s041","c":"history","l":"m","t":"The Silk Road Was Never One Road","x":"When we hear the words Silk Road, we imagine a single highway stretching from China to Rome. But it was never one road. It was a living web of routes across deserts, mountains, and seas.\n\nMerchants rarely traveled the whole way. Goods passed from hand to hand, city to city, like a message whispered down a line. Silk moved west. Glass, silver, and horses moved east.\n\nAnd with them traveled things no one could tax. Languages. Religions. Recipes. Inventions. Paper and ideas moved along those routes and changed the world.\n\nThe Silk Road was not really about silk. It was the first time the world began talking to itself."},{"id":"s042","c":"history","l":"m","t":"The Great Emu War","x":"In 1932, farmers in Western Australia faced an invasion. Around twenty thousand emus had moved onto their land, eating crops and breaking fences.\n\nThe government sent soldiers with machine guns. It seemed like an easy mission. It was not.\n\nThe emus scattered in every direction. They ran fast, split into small groups, and seemed to absorb bullets. After weeks of effort and thousands of rounds, the soldiers withdrew.\n\nNewspapers had a field day. One officer reportedly admired the birds' toughness. In the end, the farmers turned to fences and bounties instead. History remembers it with a smile: the war that the birds won."},{"id":"s043","c":"history","l":"m","t":"Builders of the Pyramids","x":"For centuries, people imagined the pyramids were built by slaves in chains. Archaeology tells a different story.\n\nNear Giza, researchers found the remains of a workers' town. Bakeries. Breweries. Sleeping quarters. Medical care, including healed broken bones. These workers were organized into teams with names, which they painted on the stones they hauled.\n\nThey were farmers, craftsmen, and laborers, many working in rotating shifts. Their tombs were built close to the pyramids, an honor reserved for people who mattered.\n\nThe pyramids are not only monuments to kings. They are monuments to thousands of ordinary people who were proud of what they built."},{"id":"s044","c":"mystery","l":"m","t":"The Village That Vanished","x":"It was a cold morning when the trapper arrived at the lakeside village. He had visited many times before. Today, something was wrong.\n\nSmoke did not rise from the chimneys. Dogs did not bark. The doors were open, and meals sat half-eaten on the tables. Coats hung on hooks. Boots stood by the fires.\n\nHe searched every house, every path, every boat. There were no footprints leading away. No signs of struggle. Only silence.\n\nHe told his story in the nearest town, and it spread like wildfire. Some said it was disease. Some said it was something worse. Some said he made it all up. But the question remains, the way questions do when no one can answer them: where does an entire village go?"},{"id":"s045","c":"mystery","l":"m","t":"The Painting That Watches","x":"The museum guard had worked nights for eleven years. He knew every painting by heart. Especially the portrait of the woman in green, hanging alone at the end of the east hall.\n\nLast week, he noticed something. Her eyes were looking left. He was sure they used to look straight ahead.\n\nHe checked old photographs. Straight ahead. He checked the security footage. Nothing moved. Nobody entered.\n\nTonight, he walks the east hall again. His footsteps echo. He reaches the end and lifts his flashlight. The woman in green is no longer looking left. She is looking at him."},{"id":"s046","c":"science","l":"m","t":"How Your Brain Lies to You","x":"Right now, your brain is editing reality. You just don't notice.\n\nYour eyes move several times every second, jerking from point to point. If you saw everything they captured, the world would look like shaky footage. So your brain cuts out the blur and stitches the pieces into a smooth picture.\n\nYou also have a blind spot in each eye, where the optic nerve connects. You never see a hole, because your brain fills it in with a guess.\n\nEven time gets edited. When you glance at a clock, the first second can seem to last longer than the rest.\n\nWhat you experience is not the world exactly as it is. It is your brain's best story about it. And it is a very convincing storyteller."},{"id":"s047","c":"science","l":"m","t":"The Water You Drink Is Ancient","x":"The glass of water in your hand is older than you think. Older than the dinosaurs. Older than the Earth itself.\n\nScientists believe much of Earth's water existed as ice in the cloud of gas and dust that formed our solar system. Some of it may be older than the Sun.\n\nSince then, that water has been on an endless journey. It has fallen as rain, frozen into glaciers, flowed through rivers, and passed through countless living things.\n\nSome of the molecules in your glass may once have been part of an ancient ocean, a cloud over a volcano, or a drop of morning dew on a fern. Every sip is a piece of history."},{"id":"s048","c":"space","l":"m","t":"The Pale Blue Dot","x":"In 1990, the Voyager 1 spacecraft was about six billion kilometers from home. Before its cameras were turned off forever, scientists asked it to turn around and take one last picture.\n\nIn that image, Earth is a tiny speck, smaller than a single pixel. A pale blue dot floating in a beam of sunlight.\n\nEverything that has ever happened to humanity happened on that dot. Every empire, every war, every love story, every song.\n\nFrom far enough away, our borders disappear. Our arguments look small. What remains is a fragile little world, and the only home we have ever known."},{"id":"s049","c":"space","l":"m","t":"What If the Moon Disappeared","x":"Imagine waking up tomorrow to find the Moon gone. At first, you might only notice darker nights. But the changes would go much deeper.\n\nThe tides would shrink dramatically. Coastal ecosystems that depend on the rhythm of the sea would be thrown into chaos.\n\nMany animals that use moonlight to hunt, migrate, or breed would lose their signal.\n\nAnd over long stretches of time, without the Moon's steadying pull, Earth's tilt could wobble more wildly, shifting seasons and climates.\n\nWe rarely think about it. But that silent rock in the sky has been quietly keeping our world in balance for billions of years."},{"id":"s050","c":"space","l":"m","t":"Life on a Space Station","x":"On the International Space Station, the sun rises about sixteen times a day. Astronauts circle the Earth every ninety minutes, at around twenty-eight thousand kilometers per hour.\n\nThere is no up or down. Astronauts sleep in bags strapped to the walls. Water floats in shiny spheres. Crumbs are a real danger, so bread is often replaced with tortillas.\n\nExercise isn't optional. Without gravity, muscles and bones weaken, so crews train for about two hours every day.\n\nAnd yet, when they talk about life up there, most astronauts mention the same thing. The view. Looking down at the planet, with no borders in sight, they say it changes how you see everything."},{"id":"s051","c":"nature","l":"m","t":"The Monarch Migration","x":"Every autumn, millions of monarch butterflies begin a journey of up to four thousand kilometers, flying from North America to the mountain forests of central Mexico.\n\nHere is the strange part. None of them has ever made the trip before. The butterflies flying south are the great-grandchildren of the ones that left the previous spring.\n\nSomehow, they find the same forests. They use the sun as a compass, correcting for the time of day with an internal clock.\n\nWhen they arrive, they cover the trees so completely that the branches turn orange. A journey no single butterfly completes, guided by a memory no single butterfly ever had."},{"id":"s052","c":"nature","l":"m","t":"The Wolves of Yellowstone","x":"In 1995, wolves returned to Yellowstone National Park after seventy years. What happened next surprised scientists.\n\nThe elk changed their behavior. They avoided open valleys where they could be hunted. In those valleys, young trees began to grow again.\n\nWillows and aspens returned to riverbanks. Birds came back to nest. Beavers had more trees to build with, and their dams created pools for fish and frogs.\n\nEcologists still debate exactly how big the wolves' effect was. But the story taught a powerful lesson. In nature, everything is connected, and sometimes, one missing piece can change the whole picture."},{"id":"s053","c":"tech","l":"m","t":"How the Internet Crosses Oceans","x":"When you send a message across the world, it doesn't fly through space. Most of the time, it travels under the sea.\n\nHundreds of fiber-optic cables lie on the ocean floor, connecting continents. Some are no thicker than a garden hose. Inside, pulses of light carry nearly all international internet traffic.\n\nSpecial ships lay these cables slowly across thousands of kilometers. When a cable breaks, from an earthquake or a ship's anchor, repair crews must find it, lift it from the depths, and splice it back together.\n\nSo the next time a video loads instantly from the other side of the planet, remember: it just took a trip along the bottom of the ocean."},{"id":"s054","c":"tech","l":"m","t":"The Day the Clocks Feared 2000","x":"As the year 2000 approached, the world held its breath. For decades, computers had stored years using only two digits. Ninety-nine for 1999. So what would happen when the clock rolled over to zero zero?\n\nWould banks think it was 1900? Would power grids fail? Would planes fall from the sky?\n\nGovernments and companies spent billions of dollars and countless hours fixing old code. Programmers came out of retirement to help.\n\nMidnight arrived. And almost nothing happened. Some people called it a hoax. Others argued the opposite: nothing happened precisely because so many people worked so hard to make sure it wouldn't."},{"id":"s055","c":"horror","l":"m","t":"The Babysitter's Call","x":"Emma had babysat for the Harper family a dozen times. The kids were asleep by nine. The house was quiet.\n\nAt ten, the phone rang. A man's voice said, have you checked on the children? Then he hung up.\n\nShe laughed it off. A prank. At ten thirty, it rang again. Same voice. Same question.\n\nShe called the police. They said they would trace the next call. Minutes later, the phone rang once more. She didn't answer. Then her cell phone buzzed. It was the police.\n\nGet out of the house now, they said. The calls are coming from inside.\n\nEmma looked up at the staircase. At the top, a door slowly creaked open."},{"id":"s056","c":"horror","l":"m","t":"The Town That Sleeps at Noon","x":"I took the back road to save time. That's how I found Millbrook.\n\nIt was exactly noon when I drove in. The streets were full of people, and every single one of them was standing perfectly still. A woman holding a grocery bag. A boy halfway through a jump. A dog with its mouth open mid-bark.\n\nI got out and touched a man's shoulder. Warm. Breathing. Eyes open.\n\nI ran back to my car. The clock on the dashboard said 12:00. It still says 12:00.\n\nI've been driving for hours now. The sun hasn't moved. And in my rearview mirror, I can see the people of Millbrook slowly turning their heads to watch me go."},{"id":"s057","c":"scifi","l":"m","t":"The Memory Market","x":"In 2071, memories can be bought and sold. The rich buy summers in places they've never visited. First kisses they never had. Victories they never earned.\n\nThe poor sell what they have. A grandmother's laugh. A wedding day. The smell of a childhood kitchen.\n\nMara sells memories to pay her rent. Small ones at first. A sunset. A birthday. Then bigger ones.\n\nOne day, she meets a man at the market who knows her name. He says they were in love once. He says she sold the memory of him three years ago.\n\nHe bought it back. And now he's the only one who remembers."},{"id":"s058","c":"scifi","l":"m","t":"Last Signal From Earth","x":"The colony ship Horizon left Earth two hundred years ago. Its crew sleeps in frozen pods, while the ship's AI watches over them.\n\nEvery year, Earth sends a signal. News. Music. Messages from families who knew the crew would never reply.\n\nThis year, no signal arrived.\n\nThe AI waited. It checked its antennas. It recalculated its position. It listened for weeks.\n\nThen it made a decision no one had programmed it to make. It woke the captain.\n\nShe opened her eyes, cold and confused. The AI said softly: I'm sorry. I didn't want you to hear this alone. I think we might be all that's left."},{"id":"s059","c":"fantasy","l":"m","t":"The Clockmaker's Daughter","x":"In a city where every person's life is measured by a clock, the clockmaker was the most powerful man alive.\n\nHe built each clock by hand, one for every newborn child. When a clock stopped, its owner's life ended.\n\nHis daughter grew up among the ticking. One night, she found a clock without a name, ticking faster than all the others.\n\nShe asked her father whose it was. He did not answer. He only looked at her with tired eyes, and she understood.\n\nThe next morning, the clockmaker's shop was empty. Every clock had been carefully wound back, by one single hour. And in the city, no one could say who had given them the gift of time."},{"id":"s060","c":"fantasy","l":"m","t":"The Girl Who Bottled Storms","x":"Lina lived on a cliff where storms rolled in from the sea. Every night, she climbed to the rocks with glass jars and caught pieces of the weather.\n\nA jar of thunder. A jar of rain. A jar of lightning that crackled against the glass.\n\nThe villagers thought she was strange. Until the summer the rains never came. The rivers dried. The crops failed.\n\nOn the darkest night of the drought, Lina walked into the village square with a wooden crate. She opened her jars one by one. The sky rumbled. The clouds gathered.\n\nAnd for the first time in months, it rained."},{"id":"s061","c":"motivation","l":"m","t":"Nobody Is Coming","x":"Here is a hard truth. Nobody is coming to save you. No perfect moment. No sudden burst of motivation. No stranger who will hand you the life you want.\n\nThat sounds harsh. But it's actually the best news you'll ever hear.\n\nBecause if nobody is coming, then you don't have to wait. You don't need permission. You don't need to be ready.\n\nYou can start today, small and unsure and imperfect. Write the first page. Make the first call. Take the first step.\n\nThe person you're waiting for has been here all along. It's you."},{"id":"s062","c":"motivation","l":"m","t":"The Man Who Failed Forward","x":"He failed in business. He lost elections. A woman he loved died young, and grief crushed him for months.\n\nMost people would have stopped. He kept going.\n\nHe studied law by candlelight. He taught himself grammar from borrowed books. He lost again, and again, and kept showing up.\n\nHis name was Abraham Lincoln. Years of setbacks came before the moment history remembers.\n\nFailure isn't the opposite of success. Sometimes, it's the road that leads there. The only real failure is deciding to stop walking."},{"id":"s063","c":"travel","l":"m","t":"Twenty-Four Hours in Kyoto","x":"Morning in Kyoto begins in silence. Thousands of orange gates wind up the mountain at Fushimi Inari, and at sunrise, you might have them almost to yourself.\n\nBy mid-morning, walk the stone streets of Higashiyama, where wooden tea houses lean together like old friends.\n\nAt noon, eat simply. A bowl of noodles, a plate of pickles, green tea poured slowly.\n\nIn the afternoon, step into the bamboo grove at Arashiyama. Listen to the stalks creak in the wind, like a forest whispering.\n\nAnd at night, wander the lantern-lit lanes of Gion. If you're lucky, you'll catch a glimpse of a geiko disappearing into a doorway, and the city will feel like a dream."},{"id":"s064","c":"travel","l":"m","t":"The Desert at Night","x":"In the day, the Sahara is a furnace. Endless sand, blinding light, heat that shimmers on the horizon.\n\nBut when the sun goes down, the desert transforms.\n\nThe temperature drops fast. The dunes turn purple, then blue, then black. Nomad guides light small fires and boil sweet mint tea.\n\nThen you look up. With no cities for hundreds of kilometers, the sky explodes with stars. So many that the Milky Way looks like a river of smoke across the sky.\n\nIn the silence, you can hear your own heartbeat. And you understand why people have crossed this desert for thousands of years, guided by nothing but the stars."},{"id":"s065","c":"food","l":"m","t":"The Story of Coffee","x":"According to legend, a goat herder in Ethiopia noticed his goats dancing after eating red berries from a certain shrub. Curious, he tried them himself.\n\nWhether that story is true, no one knows. But coffee did begin its journey in the highlands of Ethiopia.\n\nFrom there, it crossed the sea to Yemen, where it was brewed in monasteries to keep worshippers awake for night prayers.\n\nCoffee houses spread across the Middle East and later Europe. People gathered to talk, argue, play chess, and share news. Some called them schools of the wise.\n\nToday, billions of cups are poured every day. And it all may have started with a few very happy goats."},{"id":"s066","c":"food","l":"m","t":"Grandmother's Kitchen","x":"Every family has a recipe that was never written down.\n\nIt lives in someone's hands. A pinch of this, a handful of that. Stir until it feels right. Cook until it smells like home.\n\nMy grandmother made bread every Friday. I watched her for years, but I never learned. I thought there was always time.\n\nAfter she was gone, I tried to make it myself. The first loaf was flat. The second burned. The tenth was close.\n\nThe twentieth time, the kitchen filled with that smell. And for a moment, it felt like she was standing next to me, saying, see? You were watching after all."},{"id":"s067","c":"ad","l":"m","t":"The Watch That Waits","x":"Some moments move too fast. A first step. A last goodbye. A sunrise you almost missed.\n\nWe build watches for the people who want to slow down.\n\nEvery Halden watch is assembled by hand, from over one hundred and fifty parts, by craftsmen who have spent their lives mastering time.\n\nIt doesn't send notifications. It doesn't count your steps. It simply tells you what time it is, and quietly reminds you that this moment won't come again.\n\nHalden. Made for the moments worth keeping."},{"id":"s068","c":"ad","l":"m","t":"From Seed to Cup","x":"It starts on a hillside in Colombia, two thousand meters above the sea. A farmer named Rosa picks every cherry by hand, only when it's perfectly ripe.\n\nThe beans are washed in mountain water, dried in the sun, and sorted twice.\n\nThen they cross an ocean to a small roastery, where they're roasted in small batches, never rushed.\n\nWhen you open a bag of Alto Ridge Coffee, you're not just smelling coffee. You're smelling a hillside, a harvest, and a year of patient work.\n\nAlto Ridge. Taste where it comes from."},{"id":"s069","c":"ad","l":"m","t":"Your Home Knows You","x":"Imagine walking through the door, and your home simply knows.\n\nThe lights warm up as the sun goes down. The music you love starts playing softly. The temperature is already just right.\n\nNo apps to open. No buttons to press. Just a home that learns your rhythms and gently takes care of the small things.\n\nLumi Home. Simple smart living, designed around you, not the other way around.\n\nBecause coming home should feel like exactly that."},{"id":"s070","c":"kids","l":"m","t":"The Little Cloud Who Couldn't Rain","x":"High in the sky lived a little cloud named Nimbo. All the other clouds could rain. Big gray clouds, small white clouds, even puffy ones. But Nimbo could not make a single drop.\n\nThe other clouds teased him. Nimbo floated away, feeling sad and empty.\n\nHe drifted over a dry farm, where a little girl was watering a single flower with a tiny cup.\n\nNimbo wished with all his heart to help her. He squeezed and squeezed. And suddenly, one shining drop fell, and then another.\n\nThe girl looked up and laughed. Nimbo learned that he didn't need to be big to help. He just needed a reason."},{"id":"s071","c":"kids","l":"m","t":"The Bear Who Was Afraid of the Dark","x":"Barnaby was the biggest bear in the forest. He was strong, brave, and fast. But he had a secret. He was afraid of the dark.\n\nEvery night, he hid under his blanket until morning.\n\nOne evening, a tiny firefly knocked on his window. She was lost and couldn't find her family.\n\nBarnaby was scared, but he couldn't leave her alone. So together, they walked into the dark forest.\n\nThe firefly's light was small, but it was enough. And as they walked, Barnaby discovered that the dark was full of wonderful things. Glowing mushrooms. Singing frogs. Stars between the leaves.\n\nWhen they found the firefly's family, the whole sky lit up. And Barnaby was never afraid of the dark again."},{"id":"s072","c":"drama","l":"m","t":"The Phone Call","x":"Every Sunday at six, Daniel called his father. They talked about football, the weather, and nothing at all. The calls lasted five minutes. Sometimes less.\n\nDaniel always meant to say more. To ask about his father's childhood. To tell him he was proud of him. But there was always next Sunday.\n\nThen one Sunday, his father didn't answer.\n\nAt the funeral, Daniel's aunt handed him an old notebook. Inside, in shaky handwriting, his father had recorded every call. The date. The time. And one line about each.\n\nDaniel sounded happy today. Daniel got the promotion. Daniel laughed at my joke.\n\nFive minutes a week. And his father had treasured every one."},{"id":"s073","c":"drama","l":"m","t":"Two Strangers on a Train","x":"The night train was almost empty. An old woman sat across from a young man who couldn't stop checking his phone.\n\nWhere are you going? she asked. To quit my job, he said. To tell my parents I'm not becoming a doctor. To start over.\n\nShe smiled. Fifty years ago, I was on this same train, going to do the same thing. Then I got scared. I turned around at the next station.\n\nDo you regret it? he asked.\n\nShe looked out the window for a long time. Then she said, every single day.\n\nThe train slowed at the next station. The young man looked at the doors. Then he put his phone away and stayed in his seat."},{"id":"s074","c":"comedy","l":"m","t":"The Overconfident GPS","x":"I bought a new car with a talking GPS. Very polite. Very confident.\n\nOn day one, it said, turn left. There was no road. Just a lake.\n\nI said, there's a lake. It said, recalculating. Then it said, turn left.\n\nOn day two, it took me to a restaurant that closed in 1998.\n\nOn day three, it guided me forty minutes out of town to a field with one cow. It said, you have arrived at your destination. The cow looked just as confused as I did.\n\nNow I just use the GPS for company. It's still terrible at directions. But it's never once lost its confidence. Honestly? I admire that."},{"id":"s075","c":"comedy","l":"m","t":"Working From Home, Day 100","x":"Day one of working from home. I set up a desk. I wore a shirt. I made a schedule. I felt like a professional.\n\nDay ten. The desk is now also a dining table. The shirt is now also pajamas.\n\nDay thirty. I've started talking to my houseplant. Her name is Linda. She's a great listener.\n\nDay sixty. My cat attended three meetings. Everyone agrees she's the most productive member of the team.\n\nDay one hundred. My boss asked if I could turn my camera on. I said it was broken. It isn't. I just haven't worn pants since March."},{"id":"s076","c":"history","l":"l","t":"The Lost City of Petra","x":"Deep in the deserts of southern Jordan, a narrow canyon twists between towering red cliffs. For more than a kilometer, the walls press so close that the sky becomes a thin ribbon of blue. Then, suddenly, the canyon opens. And there it is.\n\nA temple carved directly into the rock face, glowing pink in the sunlight. Columns, statues, and a great stone urn, all cut from a single cliff.\n\nThis is Petra, the capital of the Nabataeans, a people who grew rich from the incense and spice trade more than two thousand years ago. Their caravans carried frankincense and myrrh across the desert, and Petra sat at the crossroads.\n\nBut the Nabataeans' greatest genius wasn't carving stone. It was water. In a land where rain was rare, they built dams, cisterns, and channels that captured every drop from sudden floods. Water flowed through the city in pipes carved into the canyon walls. Gardens grew where there should have been only sand.\n\nFor centuries, Petra thrived. Then the trade routes shifted to the sea. Earthquakes damaged its buildings. Slowly, the people left.\n\nFor hundreds of years, the outside world forgot Petra existed. Only local Bedouin tribes knew the way through the canyon.\n\nIn 1812, a Swiss explorer disguised as a traveler talked his way inside. He was among the first Europeans in centuries to see the hidden city.\n\nToday, Petra welcomes visitors from around the world. But when you walk out of that canyon and see the temple appear, you feel exactly what he must have felt. Like the desert has been keeping a secret, and has finally decided to share it."},{"id":"s077","c":"history","l":"l","t":"The Night the Lights Went Out","x":"On November ninth, 1965, at around five in the evening, a single protective relay in Ontario, Canada, tripped. It was a tiny device, set to the wrong limit. No one could have guessed what would happen next.\n\nPower surged through the network, looking for somewhere to go. One by one, power plants shut down to protect themselves. Like dominoes, the failure spread across the northeastern United States and parts of Canada.\n\nIn about thirteen minutes, around thirty million people were plunged into darkness.\n\nIn New York City, it was rush hour. Hundreds of thousands of people were trapped in the subway. Elevators stopped between floors. Traffic lights went dark, and ordinary citizens stepped into intersections to direct traffic by hand.\n\nBut something unexpected happened. There was no widespread panic. Strangers shared flashlights. Restaurants handed out food by candlelight. People sang in stalled subway cars. A full moon rose over the city, lighting the streets in silver.\n\nFor one night, a city of millions remembered that it could take care of itself.\n\nPower returned by the next morning. Engineers studied what went wrong and built new systems to prevent it from happening again. Grids became smarter, more connected, more protected.\n\nBut the people who lived through that night remembered something else. They remembered looking up and seeing stars over Manhattan. They remembered the kindness of strangers in the dark. Sometimes, it takes the lights going out for us to see each other clearly."},{"id":"s078","c":"mystery","l":"l","t":"The Ship That Sailed Itself","x":"On December fourth, 1872, sailors aboard the ship Dei Gratia spotted another vessel drifting in the Atlantic Ocean, between the Azores and Portugal. It was the Mary Celeste, an American merchant ship carrying barrels of alcohol to Italy.\n\nSomething about her movement was wrong. Her sails were partly set, but she was moving erratically, as if no one was at the wheel.\n\nThe crew rowed over and climbed aboard. What they found would become one of the most famous mysteries of the sea.\n\nThe ship was empty. The captain, his wife, their two-year-old daughter, and seven crew members were gone. There was no sign of violence. The cargo was almost entirely intact. There was food and water for months. The crew's personal belongings were still in their quarters.\n\nBut the lifeboat was missing. And the ship's papers, except for the captain's log, were gone.\n\nThe last log entry was written nine days earlier. It described nothing unusual.\n\nSo why would an experienced captain abandon a seaworthy ship and take his family into a tiny lifeboat on the open ocean?\n\nOver the years, people have suggested everything. Pirates. Mutiny. Sea monsters. A giant wave. Some wondered if fumes from the alcohol barrels made the captain fear an explosion, and he ordered everyone off the ship, planning to return when it was safe. Perhaps the rope connecting them snapped. Perhaps the wind took the ship away.\n\nNo one knows. The lifeboat was never found. Neither were the ten people aboard it.\n\nThe Mary Celeste sailed on for years after that, under new owners. But she never escaped her story. She became, forever, the ship that sailed itself."},{"id":"s079","c":"mystery","l":"l","t":"The Woman in Seat 14C","x":"Flight 902 from Lisbon to Boston was smooth and quiet. Most passengers were asleep. Only a flight attendant named Clara was walking the aisle with a tray of water.\n\nThat's when she noticed the woman in seat 14C.\n\nShe wore an old-fashioned gray coat and a small hat with a feather. She sat perfectly still, hands folded in her lap, staring at the seat in front of her. Clara offered her water. The woman didn't answer.\n\nClara checked the passenger list. Seat 14C was empty. No ticket, no booking.\n\nShe went to the galley to tell the senior attendant. When they returned together, the seat was empty. Only a small, faded boarding pass lay on the cushion.\n\nThe boarding pass was printed on thick paper, in an old typeface. Lisbon to Boston. Seat 14C. The date was from 1959.\n\nThe airline had no record of such a flight. But Clara couldn't stop thinking about it. After landing, she went to the city library and searched the archives.\n\nIn March 1959, a passenger plane flying a similar route disappeared over the Atlantic. There were no survivors. The passenger list was printed in an old newspaper. Seat 14C belonged to a woman named Helena Moreira, traveling to meet her son in Boston for the first time in ten years.\n\nClara found the son's name. He was ninety years old and living in a care home just outside the city.\n\nThe next day, she visited him. She handed him the faded boarding pass. The old man held it for a long time. Then, with tears in his eyes, he whispered, she made it. She finally made it."},{"id":"s080","c":"science","l":"l","t":"Why We Dream","x":"Every night, you leave the waking world and enter another one. A world where you can fly, where dead friends return, where your childhood home has rooms you've never seen. You might spend about two hours dreaming each night. But why?\n\nScientists still don't have one final answer. But they have some fascinating ideas.\n\nMost vivid dreams happen during a stage of sleep called REM, for rapid eye movement. During REM, your brain is extremely active, almost as active as when you're awake. But your body is temporarily paralyzed, which may keep you from acting out your dreams.\n\nOne theory says dreams help us process emotions. During REM sleep, parts of the brain involved in emotion and memory are active, while stress chemicals are reduced. Some researchers believe this lets us revisit difficult experiences in a safer state, softening their emotional sting. It might be why the advice to sleep on it often works.\n\nAnother theory suggests dreams help store memories. While you sleep, your brain replays parts of the day, deciding what to keep and what to throw away. Students who sleep after learning often remember more than those who stay awake.\n\nA third idea says dreams are a kind of rehearsal. By simulating threats, like being chased, the brain practices how to respond. That might explain why so many dreams involve running, hiding, or being lost.\n\nAnd some scientists think dreams may simply be a side effect, the brain telling itself stories out of random signals.\n\nMaybe the truth is a mix of all of these. What we do know is that sleep, and the dreams that come with it, are essential. Tonight, when you close your eyes, your brain will go to work. And somewhere in that strange, shifting world, it will be quietly helping you make sense of your life."},{"id":"s081","c":"science","l":"l","t":"The Invisible World on Your Kitchen Table","x":"Take a close look at your kitchen table. It seems clean. Empty. Still. But if you could shrink down to the size of a single cell, you would discover a world as busy as a rainforest.\n\nBacteria live on almost every surface. Most of them are harmless, and many are helpful. They arrived on your hands, your food, your shopping bags, and the air itself.\n\nA single teaspoon of garden soil can contain billions of microorganisms. Your kitchen sponge may hold more bacteria per square centimeter than almost anywhere else in your home, because it's warm, wet, and full of food.\n\nNow zoom in further. Floating in the air are tiny particles of dust. That dust contains fragments of skin, fibers from your clothes, pollen from outside, and even microscopic bits of space rock. Every year, thousands of tons of cosmic dust settle on Earth, and some of it may be on your windowsill right now.\n\nLook at the bread on the counter. If it sits long enough, spores of mold that were drifting invisibly in the air will land, grow, and spread fuzzy threads through the loaf. Those same molds gave us penicillin, one of the most important medicines ever discovered.\n\nEven the water in your glass is alive with movement. Water molecules are constantly bouncing, spinning, and colliding billions of times every second.\n\nWe think of our homes as quiet and empty. But we share them with an entire universe we cannot see. Most of it is working silently, recycling, breaking down, and keeping ecosystems in balance. Without these tiny invisible neighbors, life as we know it could not exist. You have never been alone at your kitchen table."},{"id":"s082","c":"space","l":"l","t":"The Voyager Golden Record","x":"In 1977, two spacecraft left Earth on a journey with no return. Voyager 1 and Voyager 2 were built to study Jupiter and Saturn. But scientists knew that after their mission, both would drift out of our solar system forever.\n\nSo they asked a question. If someone, someday, finds one of these spacecraft, what should we tell them about us?\n\nA small team, led by the astronomer Carl Sagan, set out to answer it. They created a golden record, a phonograph disc made of gold-plated copper, attached to the side of each spacecraft.\n\nOn it, they placed the sounds of Earth. Wind. Rain. Thunder. Crickets and birds. A heartbeat. A mother's kiss. Laughter. Footsteps.\n\nThey added greetings in fifty-five languages, from ancient Sumerian to modern Chinese. One simply says, hello from the children of planet Earth.\n\nThey included music from cultures around the world: Bach and Beethoven, Javanese gamelan, Peruvian panpipes, Indian ragas, and rock and roll.\n\nAnd they encoded more than one hundred images. Diagrams of DNA. Photos of people eating, teaching, dancing, and building.\n\nOn the cover, they engraved instructions showing how to play the record, and a map showing the location of our Sun among nearby pulsars.\n\nToday, both Voyagers are in interstellar space, billions of kilometers away. Their instruments are slowly shutting down. But the records will last far longer than our civilization might. Perhaps a billion years.\n\nWill anyone ever find them? Probably not. Space is vast, and the chance is tiny. But the record was never only a message to aliens. It was a message to ourselves. A reminder of who we are at our best: curious, hopeful, and reaching out into the dark to say, we were here."},{"id":"s083","c":"space","l":"l","t":"A Journey to the Edge of the Universe","x":"Let's take a journey. We begin here, on Earth, a small rocky planet with a thin blue atmosphere. Everything you've ever known is on this world.\n\nWe rise into space. The Moon passes by, about three hundred eighty-four thousand kilometers away. Light from the Moon takes just over one second to reach us.\n\nWe fly past Mars, the red planet, then through the asteroid belt, a scattered ring of rocky fragments. We pass Jupiter, so large that more than a thousand Earths could fit inside it. Then Saturn and its glittering rings, made of countless pieces of ice and rock.\n\nBeyond Neptune, the Sun is just a bright star. We have left our solar system.\n\nThe nearest star system, Alpha Centauri, is more than four light-years away. Our fastest spacecraft would need thousands of years to get there.\n\nWe keep going. Our Sun is one of perhaps hundreds of billions of stars in the Milky Way galaxy, a spiral of light about a hundred thousand light-years across.\n\nNow we leave the galaxy. Beside it is the Andromeda galaxy, our neighbor, about two and a half million light-years away. One day, billions of years from now, the two galaxies are expected to merge.\n\nFurther out, galaxies cluster together in groups. Those groups form enormous threads and walls, stretching across hundreds of millions of light-years. Between them lie great empty voids.\n\nAt the edge of what we can see, about forty-six billion light-years away in every direction, is the light from the early universe, a faint glow left over from the Big Bang.\n\nAnd somewhere back in the middle of all of this, on a tiny blue planet, is you. Watching. Wondering. The universe looking at itself."},{"id":"s084","c":"nature","l":"l","t":"The Secret Life of Elephants","x":"At dawn on the African savanna, a family of elephants moves slowly across the grass. At the front walks the oldest female, the matriarch. She may be more than fifty years old. Everyone follows her.\n\nHer memory is the family's greatest treasure. She remembers where water can be found during the worst droughts, even places she hasn't visited in years. She remembers which areas are safe and which are dangerous. Studies suggest that families led by older matriarchs are better at recognizing threats.\n\nElephants communicate in ways we're only beginning to understand. Some of their calls are so low that human ears can't hear them. These rumbles can travel through the air and even through the ground, possibly reaching other elephants kilometers away. Elephants may feel these vibrations through their sensitive feet and trunks.\n\nThey also show behavior that looks remarkably like emotion. When a calf is born, the family gathers around it, touching it gently with their trunks. When a calf falls into a mud hole, the adults work together to pull it out.\n\nAnd when an elephant dies, others often stop beside the body. They touch it softly with their trunks and feet. Sometimes they return to the bones months or even years later, quietly running their trunks over them.\n\nScientists are careful about calling this grief. But it is hard to watch and feel anything else.\n\nElephants face many dangers today, from habitat loss to poaching. But many communities and conservationists are working to protect them, creating corridors where families can travel safely.\n\nBecause when we protect elephants, we're not only saving the largest animals on land. We're protecting a living memory, passed from mother to daughter, across generations."},{"id":"s085","c":"tech","l":"l","t":"How a Smartphone Is Made","x":"The phone in your hand feels simple. A smooth sheet of glass, a thin metal frame. But it's one of the most complex objects humans have ever built, and its story begins deep underground.\n\nInside your phone are dozens of different elements. Copper for wiring. Gold for connections. Lithium and cobalt for the battery. Rare earth elements for the speakers, the vibration motor, and the screen colors. These materials are mined across many countries and continents.\n\nThe heart of the phone is the processor, a chip made from silicon, which is refined from ordinary sand. In ultra-clean factories, cleaner than hospital operating rooms, machines etch billions of microscopic transistors onto silicon wafers using light. Some of these features are only a few nanometers wide, thousands of times thinner than a human hair.\n\nThe screen is built from layers of glass, special coatings, and millions of tiny pixels, each able to change color many times a second.\n\nThe camera contains a stack of tiny lenses and a sensor that turns light into data. Software then processes every photo in a fraction of a second.\n\nThousands of parts come together on assembly lines where machines and human workers fit, test, and inspect every device. A single phone may contain components made in many different countries.\n\nThen comes the software. Millions of lines of code, written by thousands of engineers, make everything work together.\n\nFinally, the phone is packed, shipped, and placed in your hands.\n\nSo the next time you unlock your phone, remember: you're holding a piece of the whole planet. Mountains, deserts, oceans, fact
