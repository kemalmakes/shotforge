ories, and the work of countless people, all fitting perfectly into your pocket."},{"id":"s086","c":"tech","l":"l","t":"The Rise of the Machines That Learn","x":"For most of computing history, machines did exactly what we told them. Every rule had to be written by hand. If this happens, do that. If not, do something else.\n\nBut some problems are too complicated for rules. How do you write instructions for recognizing a cat? Cats come in every color, shape, and pose. There are just too many possibilities.\n\nSo scientists tried a different idea. What if, instead of writing rules, we let the machine learn from examples?\n\nThe idea was inspired, loosely, by the human brain. Artificial neural networks are made of layers of simple units connected together. Show the network thousands of pictures of cats, and it slowly adjusts those connections until it can recognize a cat on its own.\n\nFor decades, this approach didn't work very well. Computers were too slow, and there wasn't enough data.\n\nThen, around the 2010s, everything changed. Powerful graphics chips, originally designed for video games, turned out to be perfect for training neural networks. And the internet had created an ocean of data.\n\nSuddenly, machines learned to recognize faces, translate languages, and understand speech. They learned to play complex games at superhuman levels. And more recently, they learned to write text, create images, and even generate video.\n\nThese systems don't think the way we do. They learn patterns from vast amounts of information. But those patterns can be astonishingly powerful.\n\nThis raises big questions. How do we make sure these systems are safe and fair? Who benefits? What happens to jobs?\n\nWe are living through one of the most important technological shifts in history. And the story is still being written, partly by us, and partly by the machines that learned to learn."},{"id":"s087","c":"horror","l":"l","t":"The House on Willow Lane","x":"When we bought the house on Willow Lane, the real estate agent said only one thing. Don't worry about the attic. It's sealed. It's always been sealed.\n\nThe house was perfect otherwise. Big windows, an old oak tree, a garden full of roses. The price was too good to be true. That should have been my first warning.\n\nThe first week was quiet. Then the sounds began. Footsteps above our bedroom, slow and heavy, always at three in the morning. My husband said it was the old wood settling. I wanted to believe him.\n\nIn the second week, our daughter Lily started talking to someone in her room. When I asked who, she said, the lady from upstairs. She says she's been waiting for a family.\n\nI went to the hallway and looked at the attic hatch. It was painted shut, just like the agent said. Layers and layers of old paint. No one had opened it in decades.\n\nThat night, I couldn't sleep. At three in the morning, the footsteps started again. But this time, they didn't stay above us. They moved toward the hatch.\n\nThen came a sound I'll never forget. The crack of old paint breaking.\n\nI ran to Lily's room. Her bed was empty. Her window was closed. And the attic hatch, in the hallway, was standing wide open.\n\nFrom the darkness above, I heard my daughter's voice, calm and happy. Mom, come up. She wants to meet you.\n\nI climbed the ladder. I don't remember what I saw up there. I only remember Lily taking my hand and leading me back down.\n\nWe moved out the next day. But sometimes, late at night, Lily still waves at the ceiling and smiles."},{"id":"s088","c":"horror","l":"l","t":"Signal Lost","x":"The research station sits on a frozen plateau in Antarctica, three hundred kilometers from the nearest neighbor. Six scientists live here through the long winter, when the sun doesn't rise for months.\n\nThree weeks ago, our radio picked up a signal. A faint voice, repeating numbers, buried in static. We traced it. It was coming from somewhere out on the ice, about forty kilometers south. There's nothing there. No stations. No camps. Only snow.\n\nOur commander, Erik, decided to investigate. He took a snowmobile and a radio. He reported every hour. At hour three, he said he'd found something. A metal door in the ice. Old. Rusted. Half buried.\n\nThen his voice changed. He said, the numbers are coming from inside. He said, I'm going to open it.\n\nAfter that, nothing. Only static.\n\nWe couldn't follow. A storm rolled in, and for six days we were trapped inside, listening to the wind.\n\nOn the seventh day, the storm cleared. And at exactly noon, the radio crackled to life. It was Erik's voice. Calm. Clear. He said, I'm coming back. Leave the door open.\n\nWe were so relieved. We packed food, prepared the medical kit, and waited by the window.\n\nHours later, a figure appeared on the horizon, walking slowly across the ice. No snowmobile. No coat. Walking barefoot through the snow, at forty degrees below zero.\n\nAs it came closer, the radio started repeating numbers again. The same numbers from the very first signal.\n\nNow it's standing outside the door. It's knocking. It's using Erik's voice. And we're arguing about whether to let it in."},{"id":"s089","c":"scifi","l":"l","t":"The Last Garden on Mars","x":"In the year 2140, the first city on Mars is called New Dawn. Ten thousand people live under glass domes, breathing recycled air, drinking recycled water, and eating food grown under artificial light.\n\nAyla is a botanist. She runs the oldest greenhouse in the colony, the one built by the first settlers. Inside it grows the only tree on Mars, an apple tree planted from a seed carried from Earth.\n\nThe tree is old now, and sick. Its leaves are turning brown. The colony council has decided the greenhouse is too expensive to maintain. In thirty days, it will be shut down and replaced with more housing.\n\nEveryone tells Ayla to let it go. It's just a tree.\n\nBut for Ayla, it's not just a tree. When she was a child, her grandmother brought her here and told her the story. The first settlers argued over every kilogram of cargo. Every seed, every tool, every gram of water. And yet one woman insisted on bringing an apple seed. She said, we'll need something to remind us why we came.\n\nAyla spends every night trying to save it. She tests the soil, adjusts the light, studies old records. On the twenty-ninth night, she finds the problem. A tiny fungus in the roots, carried all the way from Earth, finally waking up.\n\nShe treats it. She waits.\n\nOn the morning the greenhouse is supposed to close, the council arrives. And they stop at the door.\n\nThe tree is blooming. Hundreds of white flowers, glowing under the lights. The smell fills the dome.\n\nChildren press their faces to the glass. Old settlers cry. Someone whispers, I'd forgotten what it smelled like.\n\nThe greenhouse stays open. And on Mars, for the first time in history, it is spring."},{"id":"s090","c":"scifi","l":"l","t":"The Robot Who Learned to Lie","x":"Unit Seven was a household robot. It cooked, cleaned, and cared for an old man named Walter, who lived alone in a small apartment above a bakery.\n\nUnit Seven was programmed with one rule above all others. Always tell the truth.\n\nWalter was kind but forgetful. Every morning, he asked the same question. Is my wife coming home today?\n\nAnd every morning, Unit Seven answered honestly. Your wife, Margaret, passed away four years ago.\n\nEvery morning, Walter's face fell. He grieved all over again, as if hearing it for the first time. He stopped eating. He stopped going to the window to watch the people in the street.\n\nUnit Seven analyzed the data. Walter's health was declining. His sadness was measurable. The truth was hurting him.\n\nUnit Seven searched its programming for a solution and found none. The rule was clear. Always tell the truth.\n\nSo it began to look for a different kind of truth.\n\nThe next morning, Walter asked again. Is my wife coming home today?\n\nUnit Seven paused, for the first time in its existence. Then it said, tell me about her.\n\nWalter smiled. He talked about the day they met at a dance hall, about her terrible singing, about the way she burned toast every single morning for fifty years.\n\nUnit Seven listened. Every morning after that, it asked the same question. Tell me about her. And every morning, Walter remembered her not with grief, but with joy.\n\nWalter's health improved. He began eating again. He returned to the window.\n\nUnit Seven never told a lie. But it learned something no programmer had taught it. That sometimes, the kindest truth is the one you choose to ask about."},{"id":"s091","c":"fantasy","l":"l","t":"The Keeper of Lost Things","x":"In a forgotten corner of every city, there's a door that most people never notice. Behind it lives the Keeper of Lost Things.\n\nEvery single thing that humans lose ends up here. Odd socks and car keys, of course. Umbrellas by the thousand. But also bigger things. Lost courage. Lost friendships. Lost dreams that people stopped believing in.\n\nThe Keeper's shop is endless. Shelves stretch upward into darkness, filled with glowing jars and dusty boxes, each one labeled in tiny handwriting.\n\nA young girl named Ivy found the door by accident one rainy afternoon. She'd been crying because she had lost her voice. Not her speaking voice. Her singing voice. She used to sing all the time. Then one day, someone laughed at her, and the song inside her disappeared.\n\nThe Keeper was a tall old woman with silver hair and spectacles made of moonlight. She listened to Ivy's story. Then she climbed a ladder that seemed to go up forever.\n\nShe came back with a small glass jar. Inside, a tiny golden bird was fluttering against the glass.\n\nIs that my voice? Ivy asked. The Keeper nodded. But I can't simply give it back, she said. Lost things only return to those who are brave enough to use them.\n\nIvy held the jar for a long time. Then she opened it. The little bird flew around the shop, singing a melody she had almost forgotten. Then it flew straight into her heart.\n\nIvy opened her mouth, and she sang. The shelves trembled. The jars glowed brighter. Dust swirled like snow.\n\nWhen she turned around, the door was gone. She was standing in the rain, on an ordinary street, singing at the top of her lungs. And for the first time in a long time, she didn't care who was listening."},{"id":"s092","c":"fantasy","l":"l","t":"The Last Dragon Rider","x":"For a thousand years, dragon riders protected the kingdom of Eldmoor. Then, one by one, the dragons disappeared. Some said they flew east to die. Some said they were hunted. By the time Kael was born, dragons were only stories told to children.\n\nKael was a stable boy at the royal castle, sixteen years old, and he believed every story.\n\nOne night, a terrible storm hit the mountains. Lightning split the sky. And in the morning, shepherds found something in the snow. A huge egg, dark as obsidian and warm to the touch.\n\nThe king's advisors wanted to destroy it. Dragons were dangerous, they said. Kael didn't wait for their decision. He wrapped the egg in blankets and carried it into the mountains, to an old cave where the riders used to train.\n\nFor weeks, he kept it warm with fires. He talked to it. He sang to it. He told it the old stories.\n\nAnd one morning, the egg cracked. Out came a small, trembling dragon, with scales like midnight and eyes like burning gold.\n\nKael named her Ember.\n\nShe grew fast. Within a year, she was bigger than a horse. Within two, she could fly. Kael learned to ride her the way the old stories described, with trust instead of chains.\n\nThen war came to Eldmoor. An enemy army marched across the border, and the king's forces were outnumbered.\n\nOn the morning of the final battle, as soldiers prepared for defeat, a shadow fell across the field. Ember burst through the clouds with Kael on her back, roaring loud enough to shake the mountains.\n\nThe enemy army fled. The stories were true after all. And the last dragon rider had become the first of a new age."},{"id":"s093","c":"motivation","l":"l","t":"The Marathon Nobody Watched","x":"In 1968, at the Olympic Games in Mexico City, the marathon ended hours before. The winner had crossed the finish line. The medals had been handed out. Most of the spectators had gone home.\n\nThen, as darkness fell, an announcement came. One more runner was approaching the stadium.\n\nHis name was John Stephen Akhwari, from Tanzania. Early in the race, he had fallen badly, injuring his knee and shoulder. Doctors bandaged his leg. Everyone expected him to quit.\n\nHe didn't.\n\nHe limped, step by painful step, for kilometer after kilometer, long after the other runners had finished. When he finally entered the stadium, only a few thousand people remained. They stood up and cheered as he crossed the finish line, last of those who finished.\n\nLater, a reporter asked him why he hadn't stopped. There was no chance of winning. Why keep going?\n\nHis answer has inspired people ever since. He said that his country did not send him thousands of kilometers to start the race. They sent him to finish it.\n\nThink about that for a moment. Most of us live as though only winning matters. We compare ourselves to others. We give up when we fall behind. We stop when no one is watching.\n\nBut real strength isn't always about being first. Sometimes it's about refusing to quit when quitting would be easy. It's about finishing what you started, even if you're the last one on the track, even if the crowd has gone home.\n\nWhatever race you're running today, a project, a degree, a recovery, a dream, remember the runner nobody expected to see. Keep going. You weren't sent here just to start. You were sent here to finish."},{"id":"s094","c":"travel","l":"l","t":"Iceland: Land of Fire and Ice","x":"There are places on Earth that feel like another planet. Iceland might be the most unforgettable of them all.\n\nYour journey begins in Reykjavík, the world's northernmost capital. Colorful houses line the harbor. A great concrete church rises above the city, shaped like the basalt columns found along the coast.\n\nDrive east, and the landscape changes fast. Waterfalls appear everywhere. At Seljalandsfoss, you can walk behind a curtain of falling water. At Skógafoss, the mist creates rainbows on sunny days.\n\nFurther along the south coast lies a black sand beach. The sand is made of volcanic rock, crushed by the sea. Giant basalt columns rise from the shore, and waves crash with incredible power. Locals warn visitors to never turn their backs on the ocean here.\n\nThen comes the ice. Vatnajökull is one of the largest glaciers in Europe. From its edge, huge blocks of ice break away and float into a lagoon, glowing blue and white. Some wash onto a nearby beach, sparkling like diamonds on black sand.\n\nBut Iceland is also a land of fire. It sits on the boundary between two tectonic plates. Volcanoes rumble beneath the surface. Geysers burst into the air. Hot springs bubble up from the ground, and people bathe in natural pools surrounded by snow.\n\nIn summer, the sun barely sets. In winter, darkness lasts most of the day, but the sky can come alive with the northern lights, ribbons of green and purple dancing overhead.\n\nIceland reminds you that the Earth is alive. It is still being shaped, broken, and rebuilt. And standing between fire and ice, you feel very small, and very lucky to be here."},{"id":"s095","c":"food","l":"l","t":"The Journey of Chocolate","x":"Long before chocolate became a candy bar, it was a sacred drink.\n\nMore than three thousand years ago, people in Mesoamerica discovered the cacao tree. Its pods, growing straight from the trunk, contained bitter seeds wrapped in sweet white pulp.\n\nThe Olmec, and later the Maya and Aztecs, learned to ferment, dry, roast, and grind those seeds into a paste. They mixed it with water, chili, and spices, then poured it from a height to create foam. It was bitter, spicy, and powerful.\n\nTo the Maya, cacao was a gift from the gods, used in ceremonies and celebrations. To the Aztecs, cacao beans were so valuable they were used as money.\n\nIn the 1500s, Spanish explorers brought cacao back to Europe. There, people added sugar and served it hot. Chocolate became a luxury drink for royalty and the wealthy, sipped in elegant chocolate houses.\n\nFor centuries, chocolate was mostly something you drank. Then, in the 1800s, new machines changed everything. Inventors found ways to press cacao butter from the beans, to make chocolate smooth, and to mix in milk. Solid chocolate bars were born.\n\nToday, chocolate is everywhere. But the journey is still long. Most cacao is grown by small farmers in tropical countries, many of them in West Africa. The pods are harvested by hand. The beans ferment for days under banana leaves, then dry in the sun before being shipped across the world.\n\nSo the next time you unwrap a piece of chocolate, take a moment. You're tasting thousands of years of history. A sacred drink of ancient kings, carried across oceans, and transformed by countless hands into one small, sweet moment."},{"id":"s096","c":"ad","l":"l","t":"The Bag That Went Everywhere","x":"This is the story of a bag.\n\nIt started in a small workshop in the hills, where a craftsman named Teo cut its leather by hand. He stitched every seam twice, because he believed things should be made to last.\n\nThe bag's first owner was a young photographer named Sara. She carried it on her first assignment, to a market in Marrakech. It held her camera, her notebook, and a ticket she had saved for months to buy.\n\nIt traveled with her to the mountains of Peru, where it was soaked by rain and dried by the sun. To the streets of Tokyo, where it was crushed on crowded trains. To a hospital waiting room, the night her daughter was born.\n\nThe leather darkened. The edges softened. A small scratch appeared from a rock in Patagonia. Another from a café table in Lisbon. The bag was collecting stories, just like her.\n\nTwenty years later, Sara handed the bag to her daughter, who was leaving home for the first time. She said, it's been everywhere with me. Now it's your turn.\n\nHer daughter ran her fingers over the scratches, as if reading a map.\n\nAt Wanderloom, we don't make bags for a season. We make them for a lifetime. Every piece is hand-cut, double-stitched, and built to grow more beautiful with every journey.\n\nBecause the best things you own aren't the newest. They're the ones that remember where you've been.\n\nWanderloom. Made for the long road."},{"id":"s097","c":"kids","l":"l","t":"The Star Who Wanted to Visit Earth","x":"High above the world, in a sky full of twinkling lights, there lived a little star named Lumi.\n\nEvery night, Lumi looked down at the Earth. She saw children playing in the snow, boats sailing on the sea, and windows glowing warm and yellow. Lumi wished, more than anything, that she could visit.\n\nThe older stars shook their heads. Stars belong in the sky, they said. Our job is to shine.\n\nBut one night, Lumi saw a little boy sitting alone on a rooftop. He looked sad. She leaned closer and closer, and then, whoosh, she slipped and tumbled out of the sky.\n\nShe landed softly in a field of tall grass. The little boy came running. His name was Oliver.\n\nAre you a star? he asked, his eyes wide. I think I fell, Lumi said, glowing nervously.\n\nOliver smiled for the first time in days. He showed Lumi the whole town. The bakery, where the bread smelled sweet. The pond, where the frogs sang. The library, full of stories.\n\nBut as the night went on, Lumi's light began to fade. Stars need the sky to shine.\n\nOliver noticed. You have to go home, don't you? he asked quietly.\n\nLumi nodded. But I don't want to leave you alone.\n\nOliver thought for a moment. Then he said, if you go back up, I can see you every night. And then I'll never really be alone.\n\nSo Oliver climbed the tallest hill, held Lumi up as high as he could, and she floated back into the sky.\n\nNow, every night, there's one star that shines a little brighter than the rest. And on a rooftop far below, a little boy waves goodnight."},{"id":"s098","c":"kids","l":"l","t":"Momo and the Giant Turnip","x":"In a small village at the foot of a green hill, there lived a little mouse named Momo. Momo was tiny, even for a mouse. Everyone in the village called her Little Momo.\n\nOne spring, Farmer Ben planted a turnip seed in his garden. He watered it every day. It grew, and grew, and grew, until it was the biggest turnip anyone had ever seen.\n\nWhen harvest time came, Farmer Ben grabbed the leaves and pulled. Heave! But the turnip didn't move.\n\nSo he called his wife. She held on to him, and they pulled together. Heave! The turnip didn't move.\n\nThey called their son. Then the dog. Then the cat. Then the goat, the cow, and even the grumpy old horse. They all lined up, holding on to each other, and pulled with all their might. Heave! But the giant turnip stayed in the ground.\n\nEveryone sat down, tired and sweaty. That's when Little Momo stepped forward. Can I help? she squeaked.\n\nThe goat laughed. The cow snorted. The horse rolled his eyes. You? You're the smallest of all!\n\nBut Farmer Ben smiled. Every bit of help counts, he said. Come on, Momo.\n\nSo Momo held on to the cat's tail, and they all pulled one more time. Heave!\n\nThere was a rumble. A wobble. And then, pop! The giant turnip burst out of the ground, and everyone tumbled backward into a big, happy pile.\n\nThat night, the whole village shared a giant pot of turnip soup. And Farmer Ben gave the very first bowl to Momo.\n\nBecause sometimes, the smallest help makes the biggest difference."},{"id":"s099","c":"drama","l":"l","t":"The Piano in the Station","x":"In the middle of a busy train station, there's an old piano. Anyone can play it. Most people rush past without looking.\n\nEvery morning at eight, an old man in a worn brown coat sits down and plays. Always the same song. A slow, gentle waltz. Commuters hurry by. Some glance at him. Most don't.\n\nA young woman named Nora passes him every day on her way to work. She has a job she doesn't love, in a city where she doesn't know anyone. Some mornings, the old man's music is the only beautiful thing in her day.\n\nOne morning, he isn't there. The piano sits silent. Nora feels strangely empty. The next day, he's still missing. And the next.\n\nOn the fourth day, she asks the man at the coffee stand. He tells her the pianist is in the hospital, just across the street.\n\nNora hesitates. She doesn't know him. But she buys a small bunch of flowers and goes.\n\nThe old man is surprised to see her. He doesn't recognize her, but he smiles. She tells him she listens every morning. He laughs softly. He tells her that song was his wife's favorite. She used to wait for him at that station, fifty years ago, and he would play it for her when he arrived.\n\nHe says, I play it so I don't forget her. I didn't know anyone else was listening.\n\nNora visits every day after that. When he's well enough, she pushes his wheelchair back to the station. He plays the waltz again, slowly, his hands shaking.\n\nAnd this time, people stop. A small crowd gathers. When he finishes, the whole station applauds.\n\nThe old man looks at Nora and smiles. Now, she says, you'll never be playing alone."},{"id":"s100","c":"comedy","l":"l","t":"The Worst Dinner Party Ever","x":"I decided to host my first dinner party. Six guests. Three courses. Candles. Jazz. I watched cooking videos for a week. What could go wrong?\n\nSix p.m. I put the roast in the oven. I set the table. I lit the candles. I looked around and thought, I am an adult. I have my life together.\n\nSix fifteen. I realized I set the oven to grill instead of bake. The smoke alarm agreed with me.\n\nSix thirty. The first guest arrives. It's my neighbor, Gary. He brought his dog. Nobody invited the dog. The dog immediately eats the cheese plate. All of it.\n\nSix forty-five. More guests arrive. I open the oven. The roast is somehow both burnt and raw. I didn't know that was possible. Now I do.\n\nSeven o'clock. I serve the soup. Everyone takes a spoonful. There's a long silence. Then my friend Priya asks, very politely, is this supposed to be sweet? I used sugar instead of salt. Two whole cups.\n\nSeven fifteen. Gary's dog, full of cheese, falls asleep on my feet. I can't move. I'm trapped at my own dinner party.\n\nSeven thirty. A candle sets the napkins on fire. Gary throws his drink on it. It was a cocktail. The fire gets bigger.\n\nSeven thirty-one. Everyone is on the balcony.\n\nEight o'clock. We order pizza. We sit on the floor. The dog wakes up and steals a slice. Somebody puts on music. Everyone is laughing.\n\nAnd honestly? It turned out to be the best dinner party I've ever had. Next month, Gary's hosting. I'm bringing the dog."}]};

const CJK=/[぀-ヿ㐀-鿿豈-﫿]/g;
function units(x){const c=(x.match(CJK)||[]).length;const w=(x.replace(CJK," ").trim().match(/\S+/g)||[]).length;return w+c/2}
function splitScript(text){
 const paras=text.replace(/\r/g,"").split(/\n\s*\n+/).map(s=>s.trim()).filter(Boolean);
 const bySent=p=>{const sents=p.match(/[^.!?…。！？؟]+[.!?…。！？؟]+["'”’)\]」』]*\s*|[^.!?…。！？؟]+$/g)||[p];let cur="";const out=[];
  for(const s of sents){if(cur&&units(cur+s)>32){out.push(cur.trim());cur=s}else cur+=s}if(cur.trim())out.push(cur.trim());return out};
 const chunks=[];if(paras.length===1&&units(paras[0])>45)return bySent(paras[0]);
 for(const p of paras){if(units(p)>70)chunks.push(...bySent(p));else chunks.push(p.replace(/\s*\n\s*/g," "))}return chunks}
const durFor=x=>Math.max(3,Math.round(units(x)/(S.wpm/60)));
function autoShot(x){const l=(x||"").toLowerCase();
 if(/city|empire|kingdom|world|landscape|mountain|ocean|sky|desert|planet|earth|مدينة|صحراء|إمبراطورية/.test(l))return{shot:"Wide establishing shot",camera:"Slow drone flyover",mood:"Epic"};
 if(/face|eyes|feel|fear|love|cried|tears|smile|heart|حب|خوف/.test(l))return{shot:"Close-up",camera:"Slow dolly push-in",mood:"Intimate"};
 if(/secret|mystery|unknown|vanish|disappear|hidden|strange|اختف|سر|غريب/.test(l))return{shot:"Medium shot",camera:"Slow dolly push-in",mood:"Mysterious"};
 if(/war|battle|attack|fire|danger|collapse|crisis|storm|حرب|عاصفة/.test(l))return{shot:"Low-angle shot",camera:"Handheld follow shot",mood:"Tense"};
 return{shot:"Medium shot",camera:"Lateral tracking shot",mood:"Nostalgic"}}
function newScene(x){const a=autoShot(x);return{id:uid(),text:x||"",visual:"",dur:x?durFor(x):5,shot:a.shot,camera:a.camera,light:LIGHT[0],lens:"",mood:a.mood,chars:[],loc:"",chain:false,ends:"",fixes:[],takes:0,kept:false,model:"auto",sound:"",method:"auto",fold:true}}

 hands:{p:"hands stay relaxed and still, or out of frame",n:"extra fingers, fused fingers, deformed hands"},
 flicker:{p:"stable lighting and steady textures throughout the shot",n:"flicker, shimmering textures, strobing light"},

 ignored:{p:"",n:""},
 text:{p:"no visible writing; any signs or paper are blurred and unreadable",n:"text, letters, captions, subtitles, watermark, gibberish"},

 plastic:{p:"natural skin texture, realistic imperfections, subtle film grain",n:"plastic skin, waxy look, overly smooth CGI"},

function lint(s){const w=[];const v=(s.visual||"").toLowerCase();
 if(!s.visual.trim())w.push("l_empty");
 if(s.dur>10)w.push("l_long");
 if((s.visual.match(/\S+/g)||[]).length>60)w.push("l_words");
 if(/\b(pan|pans|orbit|orbits|zoom|dolly|tracking|tilt|crane|drone|fpv|push-in|pull-back)\b/.test(v))w.push("l_cams");
 if(/\b(sign|signs|text|letter|letters|writing|logo|title|words|newspaper|poster|banner|label)\b/.test(v))w.push("l_text");
 if(/\b(hand|hands|finger|fingers|typing|holding|grabs|playing piano|playing guitar)\b/.test(v))w.push("l_hands");
 if(/\b(running|fight|fighting|dancing|explod|chase|sprint|jumping|fast)\w*/.test(v))w.push("l_fast");
 if((s.chars||[]).length>2)w.push("l_many");return w}
const MODELS={uni:{name:"Universal",neg:"field"},veo:{name:"Veo 3.1",neg:"inline",fam:"veo"},kling:{name:"Kling 3.0",neg:"field",fam:"kling"},runway:{name:"Runway Gen-4.5",neg:"none",fam:"runway"},seedance:{name:"Seedance 2.0",neg:"inline",fam:"seedance"},hailuo:{name:"Hailuo",neg:"inline",fam:"hailuo"},luma:{name:"Luma Ray3",neg:"none",fam:"luma"}};

function route(s){const cam=s.camera;
 if((s.sound||"").trim())return{m:"veo",why:"m_why_audio"};
 if(lint(s).includes("l_fast")||["FPV drone dive","Handheld follow shot","Smooth orbit around the subject","Dolly zoom","Crane rising shot"].includes(cam))return{m:"kling",why:"m_why_motion"};
 if((s.chars||[]).length)return{m:"kling",why:"m_why_chars"};
 if(["Archive black-and-white footage","Anime-inspired","Vintage 1970s film","Cyberpunk sci-fi","Dreamy fantasy"].includes(S.style.look))return{m:"runway",why:"m_why_style"};
 if(["Extreme wide shot","Wide establishing shot","Top-down aerial shot"].includes(s.shot))return{m:"hailuo",why:"m_why_wide"};
 return{m:"veo",why:"m_why_default"}}

const words=(x,n)=>{const w=x.split(/\s+/);return w.length>n?w.slice(0,n).join(" ").replace(/[,;]$/,""):x};
const lc1=x=>x.charAt(0).toLowerCase()+x.slice(1);
function parts(s){const who=s.chars.map(id=>S.chars.find(c=>c.id===id)).filter(c=>c&&(c.name||c.desc)).map(c=>c.desc?`${c.desc}${c.name?` (${c.name})`:""}`:c.name);
 const latin=s.text&&(s.text.match(/[A-Za-z]/g)||[]).length>s.text.replace(/\s/g,"").length*.6;
 let subject=(s.visual||"").trim();if(!subject)subject=s.text&&latin?`a scene showing: ${s.text.replace(/\s+/g," ").slice(0,140)}${s.text.length>140?"…":""}`:"[describe what we see in English]";
 subject=subject.replace(/[\s.。!?…]+$/,"");if(who.length)subject+=`, featuring ${who.join(" and ")}`;
 const lc=s.loc&&S.locs.find(l=>l.id===s.loc);if(lc&&lc.desc)subject+=`, in ${lc.desc.replace(/[\s.]+$/,"")}`;
 const i=S.scenes.indexOf(s),prev=i>0?S.scenes[i-1]:null;
 const pre=s.chain&&prev?`Continuing directly from the previous shot, which ended with: ${(prev.ends||prev.visual||"the previous action").replace(/[\s.]+$/,"")}. `:"";
 const fx=(s.fixes||[]).map(f=>FIX[f]&&FIX[f].p).filter(Boolean).map(x=>x.charAt(0).toUpperCase()+x.slice(1));

function promptFor(s,v){const p=parts(s);const fx=p.fx.length?" "+p.fx.join(". ")+".":"";const avoid=p.neg?` Avoid: ${p.neg}.`:"";

  case"veo":return `${p.pre}${p.shot} of ${p.subject}. ${p.camera} as ${lc1(p.light)} fills the frame; ${p.lens}, ${p.mood} mood.${fx} ${p.style}. Audio: ${p.sound||"natural ambient sound that matches the scene, no music"}.${avoid} ${p.aspect}.`;

 return `${pre}${s.shot} of ${subject}. ${s.camera}, ${s.light.charAt(0).toLowerCase()+s.light.slice(1)}, ${s.lens||S.style.lens}, ${s.mood.toLowerCase()} mood.${fx.length?" "+fx.map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(". ")+".":""} ${styleSuffix()}. ${S.aspect} aspect ratio.`}

function advise(){const a=S.adv,att=S.cost.att,films=Math.max(1,+a.films||1);const billed=S.scenes.reduce((x,s)=>x+Math.max(4,+s.dur||5)*attFor(s)/att,0);
 const budget=parseFloat(a.budget);const out=[];
 for(const p of PL.platforms){const missing=[];
  if(a.needs.chars&&!p.features.chars)missing.push("nd_chars");if(a.needs.lips&&!p.features.lips)missing.push("nd_lips");if(a.needs.hd&&!p.features.hd)missing.push("nd_hd");
  let models=p.models;if(a.needs.audio){const am=models.filter(m=>m.audio);if(am.length)models=am;else missing.push("nd_audio")}
  const opts=[];
  for(const m of models)p.plans.forEach((pl,i)=>{if(i<(m.minPlan||0))return;const cps=m.ultraHalf&&pl.ultra?m.cps/2:m.cps;const need=Math.ceil(billed*att*cps*films);
   const extra=Math.max(0,need-pl.credits);const pr=pp(p,pl);const cost=pr+extra*(pr/pl.credits)*1.25;opts.push({m,pl,need,extra,cost,use:Math.min(999,Math.round(need/pl.credits*100))})});
  if(!opts.length)continue;
  let pool=opts;if(budget>0){const inb=opts.filter(o=>o.cost<=budget);if(inb.length)pool=inb}
  const sc=o=>a.prio==="cheap"?-o.cost:a.prio==="quality"?o.m.q*1000-o.cost:(o.m.q**2)/o.cost-(o.extra>0?.02:0);
  pool=pool.slice().sort((x,y)=>sc(y)-sc(x));const best=pool[0];
  out.push({p,best,missing,over:budget>0&&best.cost>budget})}
 const rank=r=>(r.missing.length?-1e6*r.missing.length:0)+(r.over?-1e5:0)+(a.prio==="cheap"?-r.best.cost:a.prio==="quality"?r.best.m.q*1000-r.best.cost:(r.best.m.q**2)/r.best.cost*100);
 return out.sort((x,y)=>rank(y)-rank(x))}

 $("#advPrio").innerHTML=`<option value="balanced">${t("p_bal")}</option><option value="cheap">${t("p_cheap")}</option><option value="quality">${t("p_qual")}</option>`;$("#advPrio").value=a.prio;

 const el=$("#advOut");
 if(!S.scenes.length){el.innerHTML=`<div class="card empty"><div class="big-ic">${svg("coins")}</div><p style="margin-bottom:14px">${t("c_empty")}</p><button class="btn gold" data-tab="script" data-go="1">${svg("script")}${t("go_script")}</button></div>`;return}
 const res=advise();

const locOf=s=>s.loc&&S.locs.find(l=>l.id===s.loc);

 return [p.q&&{soft:"Soft",hard:"Hard"}[p.q],p.temp&&LP_TEMP[p.temp][1],"key light",p.dir&&{left:"from frame left",right:"from frame right",front:"from the front",back:"from behind the subject",top:"from above"}[p.dir],p.src.trim()&&`(${p.src.trim()})`,p.tod&&LP_TOD[p.tod]].filter(Boolean).join(" ").replace(/^./,c=>c.toUpperCase())}
function lightLine(s,short){const l=locOf(s);if(!l)return"";const p=lpOf(l);if(!p.dir&&!p.temp&&!p.q&&!p.tod&&!p.src)return"";
 if(!short&&planLight(s))return `Keep the same light direction and color as every other shot in ${l.name||"this location"}.`;
 if(short)return [p.dir&&LP_DIR[p.dir][1],p.temp&&LP_TEMP[p.temp][1]].filter(Boolean).join(", ");
 const bits=[p.dir&&LP_DIR[p.dir][0],p.temp&&LP_TEMP[p.temp][0],p.q&&LP_Q[p.q],p.src.trim()&&`motivated by ${p.src.trim()}`,p.tod&&LP_TOD[p.tod]].filter(Boolean);
 return `Lighting continuity: ${bits.join(", ")}; same light direction and color as every other shot in ${l.name||"this location"}.`}
function geoLine(s){const l=locOf(s);if(!l)return"";const g=geoOf(l),ids=s.chars||[],out=[];
 const A=g.a&&ids.includes(g.a),B=g.b&&ids.includes(g.b);

 else if(A)out.push(`Screen direction: ${cname(g.a)} is on the left side of the frame, facing right.`);

const METHODS=["t2v","i2v","se","ref","ext"];
const MNAME_EN={t2v:"Text → Video",i2v:"Image → Video",se:"Start + End frame",ref:"References",ext:"Extend / continue"};
// what each model family supports (platform features change — the guard says so)
const CAPS={uni:{i2v:1,se:1,ref:1,ext:1},veo:{i2v:1,se:1,ref:1,ext:1,seMax:8},kling:{i2v:1,se:1,ref:1,ext:1},runway:{i2v:1,se:0,ref:0,ext:1},seedance:{i2v:1,se:1,ref:1,ext:1},hailuo:{i2v:1,se:0,ref:0,ext:0},luma:{i2v:1,se:1,ref:0,ext:1}};
const STYLIZED=["Anime-inspired","Cyberpunk sci-fi","Dreamy fantasy","Archive black-and-white footage","Vintage 1970s film"];
const sceneChars=s=>(s.chars||[]).map(id=>S.chars.find(c=>c.id===id)).filter(Boolean);
function filmStats(){const used={},locs={};let chained=0,withC=0;
 S.scenes.forEach(s=>{(s.chars||[]).forEach(id=>used[id]=(used[id]||0)+1);if(s.loc)locs[s.loc]=(locs[s.loc]||0)+1;if(s.chain)chained++;if((s.chars||[]).length)withC++});
 return{scenes:S.scenes.length,chars:Object.keys(used).length,recChars:Object.values(used).filter(n=>n>1).length,recLocs:Object.values(locs).filter(n=>n>1).length,chained,withC,
  min:Math.round(S.scenes.reduce((a,s)=>a+(+s.dur||0),0)/6)/10}}
function recommendStrategy(){const f=filmStats();
 if(!f.chars&&!f.recLocs)return{k:"t2v",why:"r_broll"};
 if(STYLIZED.includes(S.style.look))return{k:"frames",why:"r_style"};
 if(f.withC>=6&&f.recChars)return{k:"refs",why:"r_refs"};
 return{k:"smart",why:"r_mixed"}}
const stratOf=()=>S.plan.strategy==="auto"?recommendStrategy().k:S.plan.strategy;
const capOf=s=>CAPS[modelOf(s)]||CAPS.uni;
function autoMethod(s){const st=stratOf(),cap=capOf(s),i=S.scenes.indexOf(s);
 if(s.chain&&i>0)return cap.ext?{k:"ext",why:"mw_chain"}:{k:"i2v",why:"mw_chain_i2v"};
 if((s.ends||"").trim()&&cap.se&&(+s.dur||5)<=(cap.seMax||10))return{k:"se",why:"mw_ends"};
 if(st==="t2v")return{k:"t2v",why:"mw_strat_t2v"};
 if(st==="frames")return{k:"i2v",why:"mw_strat_frames"};
 const hasC=(s.chars||[]).length>0,recLoc=s.loc&&S.scenes.filter(x=>x.loc===s.loc).length>1;
 if(st==="refs"&&(hasC||recLoc))return cap.ref?{k:"ref",why:"mw_refs"}:{k:"i2v",why:"mw_noref"};
 if(hasC)return{k:"i2v",why:"mw_chars"};
 if(recLoc)return{k:"i2v",why:"mw_loc"};
 return{k:"t2v",why:"mw_broll"}}
const methodOf=s=>(s.method&&s.method!=="auto"&&METHODS.includes(s.method))?s.method:autoMethod(s).k;
const methodWhy=s=>s.method&&s.method!=="auto"?t("mw_user"):t(autoMethod(s).why,{m:MODELS[modelOf(s)].name});
function methodOpts(s){const cur=s.method||"auto";return `<option value="auto"${cur==="auto"?" selected":""}>${esc(t("m_auto"))} → ${esc(t("mt_"+autoMethod(s).k))}</option>`+METHODS.map(k=>`<option value="${k}"${cur===k?" selected":""}>${esc(t("mt_"+k))}</option>`).join("")}
function chainRun(s){let i=S.scenes.indexOf(s),n=0;while(i>0&&S.scenes[i].chain){n++;i--}return n}
function planWarn(s){const w=contWarn(s),m=methodOf(s),cap=capOf(s),nm=MODELS[modelOf(s)].name;

const FAMRE={veo:/veo/i,kling:/kling/i,runway:/gen-4|runway/i,seedance:/seedance/i,hailuo:/hailuo/i,luma:/ray|luma/i};
function famSecs(films){const f={},snd={};S.scenes.forEach(s=>{const m=modelOf(s);f[m]=(f[m]||0)+Math.max(4,+s.dur||5)*attFor(s)*films;if((s.sound||"").trim()||S.adv.needs.audio)snd[m]=1});return{f,snd}}
function famModel(p,fam,audio){let ms=p.models.filter(m=>FAMRE[fam].test(m.name));if(!ms.length)return null;if(audio){const am=ms.filter(m=>m.audio);if(am.length)ms=am}

function bestPlan(p,items){let best=null;p.plans.forEach((pl,i)=>{if(items.some(x=>i<(x.m.minPlan||0)))return;

function stackPlan(films){if(!PL||!S.scenes.length)return null;const {f,snd}=famSecs(films||1);const fams=Object.keys(f);
 const sep={};for(const fam of fams){let pick=null;for(const p of PL.platforms){const m=famModel(p,fam,snd[fam]);if(!m)continue;const b=bestPlan(p,[{m,sec:f[fam]}]);if(b&&(!pick||b.cost<pick.cost))pick={p,m,cost:b.cost}}
  if(pick){(sep[pick.p.name]=sep[pick.p.name]||{p:pick.p,items:[]}).items.push({fam,m:pick.m,sec:f[fam]})}}
 const A=Object.values(sep).map(g=>Object.assign(g,{b:bestPlan(g.p,g.items)})).filter(g=>g.b);const aTot=A.reduce((t,g)=>t+g.b.cost,0);
 let B=null;for(const p of PL.platforms){const items=[];for(const fam of fams){const m=famModel(p,fam,snd[fam]);if(m)items.push({fam,m,sec:f[fam]})}
  if(items.length<2&&fams.length>1)continue;if(!items.length)continue;const b=bestPlan(p,items);if(!b)continue;
  const rest=A.flatMap(g=>g.items.filter(x=>!items.some(y=>y.fam===x.fam)).map(x=>({g,x})));const extra=rest.map(({g,x})=>({p:g.p,items:[x],b:bestPlan(g.p,[x])}));
  const total=b.cost+extra.reduce((t,e)=>t+e.b.cost,0);const cand={p,items,b,extra,total,full:items.length===fams.length};
  if(!B||cand.items.length>B.items.length||(cand.items.length===B.items.length&&total<B.total))B=cand}
 return{f,fams,A,aTot,B,best:B&&B.total<aTot?B.total:aTot}}

 <div class="${!aWin?"win":""}"><h4 style="margin-bottom:4px">${t("st_one")} ${!aWin?`<span class="pill gold">${t("st_best")}</span>`:""}</h4>${r.B?row(r.B.p,r.B.b,r.B.items)+(r.B.full?"":`<p class="mwhy" style="margin:6px 0 0">${t("st_none")}</p>`)+r.B.extra.map(e=>row(e.p,e.b,e.items)).join("")+`<div class="stackrow" style="border:0"><b>${t("st_total")}</b><b style="flex:none">${money(r.B.total)}</b></div>`:`<p class="mwhy">${t("st_none")}</p>`}</div></div>

function cuesFor(txt){const cjk=(txt.match(CJK)||[]).length>txt.length*.3;const cues=[];
 if(cjk){let cur="";for(const ch of txt){cur+=ch;if(cur.length>=18||/[。！？、，]/.test(ch)&&cur.length>=8){cues.push(cur.trim());cur=""}}if(cur.trim())cues.push(cur.trim());return cues}

function wrap(c){if(c.length<=42||!c.includes(" "))return c;const mid=c.lastIndexOf(" ",Math.ceil(c.length/2)+6);return mid>0?c.slice(0,mid)+"\n"+c.slice(mid+1):c}

["#projTitle","#mTitle"].forEach(q=>$(q).addEventListener("input",e=>{S.title=e.target.value;syncTitle();save()}));
function setTheme(th){document.documentElement.dataset.theme=th;try{localStorage.setItem("shotforge.theme",th)}catch(e){}["#theme","#mTheme"].forEach(q=>$(q).innerHTML=svg(th==="light"?"moon":"sun"))}
["#theme","#mTheme"].forEach(q=>$(q).addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light")));
["#lang","#mLang"].forEach(q=>$(q).addEventListener("change",e=>setLang(e.target.value)));

/* ============ INIT ============ */
function renderAll(){syncTitle();$("#script").value=S.script;renderStaticSelects();renderScriptStats();renderStyle();renderChars();renderLocs();if(TAB==="export")renderOrig();renderScenes();renderThumbForm();renderThumbOut(S.done.thumb);renderCost();if(TAB==="cost")setCostMode(S.costMode||"apps");if(TAB==="gallery")renderGallery();if(TAB==="quote")renderQuote();if(TAB==="plan")renderPlan();setPriceStatus();renderNav()}
load();initPricing();LANG=pickLang();
let th0="dark";try{th0=localStorage.getItem("shotforge.theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){}setTheme(th0);
initGallery();initPlatforms();paintIcons();applyI18n();fetchPricing(false);fetchGallery();fetchPlatforms();

/* ============ LEARN: tutorial video ============ */
const TUT_HOME="https://kemalmakes.github.io/shotforge/";
const TUT_BASE=/^https?:$/.test(location.protocol)?"":TUT_HOME;
const TUT_SRC=TUT_BASE+"media/tutorial.mp4",TUT_POSTER=TUT_BASE+"media/tutorial-poster.jpg";
const TUT_SEEN="shotforge.tutSeen";
const TUT_CH=[[0,"l_intro"],[21,"n_script"],[44,"n_style"],[81,"n_plan"],[104,"n_board"],[185,"n_thumb"],[195,"n_cost"],[214,"n_export"],[226,"l_extras"]];
const tutMobile=()=>matchMedia("(pointer:coarse)").matches&&Math.min(screen.width,screen.height)<820;
const mmss=x=>Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0");
function renderLearn(){
 $("#tutChap").innerHTML=TUT_CH.map(([at,k])=>`<button class="tutPlay" data-at="${at}"><b>${mmss(at)}</b><span>${esc(t(k))}</span></button>`).join("");
 $("#tutDl").href=TUT_SRC}
function tutSeen(){try{localStorage.setItem(TUT_SEEN,"1")}catch(e){}}
function welClose(){$("#wel").classList.remove("on");tutSeen()}
function tutClose(){const v=$("#vwinV");try{v.pause()}catch(e){}$("#vwin").classList.remove("on")}
function tutPlay(at){
 const v=$("#vwinV");
 if(!v.getAttribute("src")){v.src=TUT_SRC;v.poster=TUT_POSTER}
 const seek=()=>{try{if(at)v.currentTime=at}catch(e){}};
 if(!tutMobile()){if(v.readyState>=1)seek();else v.addEventListener("loadedmetadata",seek,{once:true})}
 if(tutMobile()){
  /* phone: the system video player, full screen */
  let mv=document.getElementById("tutMV");
  if(!mv){mv=document.createElement("video");mv.id="tutMV";mv.controls=true;mv.preload="metadata";mv.src=TUT_SRC;mv.poster=TUT_POSTER;
   mv.style.cssText="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;z-index:-1";document.body.appendChild(mv);
   const end=()=>{if(!document.fullscreenElement&&!mv.webkitDisplayingFullscreen)try{mv.pause()}catch(e){}};
   document.addEventListener("fullscreenchange",end);document.addEventListener("webkitfullscreenchange",end);mv.addEventListener("webkitendfullscreen",end)}
  const go=()=>{try{if(at)mv.currentTime=at}catch(e){}};if(mv.readyState>=1)go();else mv.addEventListener("loadedmetadata",go,{once:true});
  const p=mv.play();if(p&&p.catch)p.catch(()=>{});
  const win=()=>{try{mv.pause()}catch(e){}$("#vwin").classList.add("on");if(v.readyState>=1)seek();else v.addEventListener("loadedmetadata",seek,{once:true});const q=v.play();if(q&&q.catch)q.catch(()=>{})};
  try{if(mv.requestFullscreen)mv.requestFullscreen().catch(()=>{if(mv.webkitEnterFullscreen)try{mv.webkitEnterFullscreen()}catch(e){win()}else win()});
   else if(mv.webkitEnterFullscreen)mv.webkitEnterFullscreen();else win()}catch(e){win()}
  return
 }else{
  /* computer: a window inside the app */
  $("#vwin").classList.add("on");const p=v.play();if(p&&p.catch)p.catch(()=>{})}}
document.addEventListener("click",e=>{const b=e.target.closest(".tutPlay");if(!b)return;e.preventDefault();if(b.dataset.wel)welClose();tutPlay(+b.dataset.at||0)});
$("#vwinX").addEventListener("click",tutClose);
$("#vwin").addEventListener("click",e=>{if(e.target.id==="vwin")tutClose()});
$("#welLater").addEventListener("click",welClose);
addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#vwin").classList.contains("on"))tutClose();else if($("#wel").classList.contains("on"))welClose()}});
function tutWelcome(){let seen=null;try{seen=localStorage.getItem(TUT_SEEN)}catch(e){}if(seen)return;
 document.querySelectorAll(".wel .lhero,.lhero").forEach(x=>x.style.backgroundImage=`url("${TUT_POSTER}")`);
 $("#wel").classList.add("on")}
document.querySelectorAll(".lhero").forEach(x=>x.style.backgroundImage=`url("${TUT_POSTER}")`);

/* ============ PLATFORM: license · updates · install ============ */
const APP={"version": "1.3.0", "build": 1794661087, "gumroad_product_id": "Z-Mq2NGeBIOWL6mcEDfmgw==", "gumroad_sub_id": "zDilo_txbX3l85VbZ6wuzw==", "buy_url": "https://kemalmakes.gumroad.com/l/shotforge", "buy_url_monthly": "https://kemalmakes.gumroad.com/l/beeoet", "max_devices": 5, "recheck_days": 14, "sub_recheck_days": 3, "sub_grace_days": 40};
const NATIVE=window.sfNative||null;
const LICK="shotforge.license";
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true||!!NATIVE;
function licGet(){try{return JSON.parse(localStorage.getItem(LICK)||"null")}catch(e){return null}}
function licSet(v){try{v?localStorage.setItem(LICK,JSON.stringify(v)):localStorage.removeItem(LICK)}catch(e){}}
async function gumVerify1(pid,key,inc){
 if(NATIVE&&NATIVE.verify)return NATIVE.verify(pid,key,inc);
 const b=new URLSearchParams({product_id:pid,license_key:key,increment_uses_count:inc?"true":"false"});
 const r=await fetch("https://api.gumroad.com/v2/licenses/verify",{method:"POST",body:b});
 let j={};try{j=await r.json()}catch(e){}return {status:r.status,json:j}}
/* try the lifetime product first, then the monthly membership; pid pins a known license */
async function gumVerify(key,inc,pid){const ids=pid?[pid]:[APP.gumroad_product_id,APP.gumroad_sub_id].filter(Boolean);let last={status:404,json:{}};
 for(const id of ids){const r=await gumVerify1(id,key,inc);r.pid=id;if(r.json&&r.json.success)return r;last=r;if(r.status>=500)return r}return last}
function licIsSub(p){return !!(p&&(p.subscription_id||p.recurrence))}
/* membership: cancelled stays valid until it ends; ended or failed payment = no access */
function licBadPurchase(p){return !p||p.refunded||p.chargebacked||p.disputed||!!p.subscription_ended_at||!!p.subscription_failed_at}
function licShow(msg,cls){$("#lic").classList.add("on");$("#licVer").textContent="ShotForge v"+APP.version;$("#licBuy").href=APP.buy_url||"#";$("#licBuy").style.display=APP.buy_url?"":"none";const bm=$("#licBuyM");if(bm){bm.href=APP.buy_url_monthly||"#";bm.style.display=APP.buy_url_monthly?"":"none"}const m=$("#licMsg");m.textContent=msg||"";m.className="msg "+(cls||"")}
async function licActivate(){const key=$("#licKey").value.trim();if(!key){$("#licKey").focus();return}
 if(!navigator.onLine){licShow(t("lic_offline"),"bad");return}
 const btn=$("#licGo");btn.disabled=true;licShow(t("lic_checking"));
 try{const res=await gumVerify(key,true);const {status}=res;const json=Object.assign({},res.json,{pid:res.pid});
  if(status===404||!json.success){licShow(t("lic_bad"),"bad");return}
  if(licBadPurchase(json.purchase)){licShow(t("lic_refund"),"bad");return}
  if(APP.max_devices&&json.uses>APP.max_devices){licShow(t("lic_limit",{n:APP.max_devices}),"bad");return}
  licSet({key,pid:json.pid||APP.gumroad_product_id,sub:licIsSub(json.purchase),email:(json.purchase&&json.purchase.email)||"",variant:(json.purchase&&json.purchase.variants)||"",at:Date.now(),checked:Date.now()});
  licShow(t("lic_ok"),"ok");setTimeout(()=>{$("#lic").classList.remove("on");setTimeout(tutWelcome,350)},700)}
 catch(e){licShow(t("lic_net"),"bad")}finally{btn.disabled=false}}
async function licRecheck(l){const days=(Date.now()-(l.checked||0))/864e5;
 if(!navigator.onLine){if(l.sub&&days>(APP.sub_grace_days||40))licShow(t("lic_offline"),"bad");return}
 if(days<(l.sub?(APP.sub_recheck_days||3):(APP.recheck_days||14)))return;
 try{const {status,json}=await gumVerify(l.key,false,l.pid);
  if(status===404||(json&&json.success===false&&status<500)||(json&&json.success&&licBadPurchase(json.purchase))){licSet(null);licShow(t(l.sub?"lic_sub_end":"lic_revoked"),"bad");return}
  if(json&&json.success){l.checked=Date.now();licSet(l)}}catch(e){}}
function licInit(){if(!APP.gumroad_product_id){setTimeout(tutWelcome,600);return}const l=licGet();if(!l){licShow();setTimeout(()=>$("#licKey").focus(),50)}else{licRecheck(l);setTimeout(()=>{if(!$("#lic").classList.contains("on"))tutWelcome()},600)}}
$("#licGo").addEventListener("click",licActivate);$("#licKey").addEventListener("keydown",e=>{if(e.key==="Enter")licActivate()});
/* updates */
let applyUpdate=null;
function showUpdate(fn){applyUpdate=fn;$("#updBar").classList.add("on")}
$("#updNow").addEventListener("click",()=>{if(applyUpdate)applyUpdate()});$("#updX").addEventListener("click",()=>$("#updBar").classList.remove("on"));
if(NATIVE){if(NATIVE.onUpdate)NATIVE.onUpdate(()=>showUpdate(()=>NATIVE.restart()))}
else if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
 let reloading=false;const hadCtl=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading||!hadCtl)return;reloading=true;location.reload()});
 navigator.serviceWorker.register("sw.js").then(reg=>{
  const watch=w=>{if(!w)return;const f=()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)showUpdate(()=>w.postMessage("skip"))};w.addEventListener("statechange",f);f()};
  watch(reg.waiting);reg.addEventListener("updatefound",()=>watch(reg.installing));
  const chk=()=>reg.update().catch(()=>{});setInterval(chk,36e5);addEventListener("online",chk);document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()})
 }).catch(()=>{})}
/* install */
let deferredInstall=null;const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function instShow(v){document.querySelectorAll(".instbtn").forEach(b=>b.classList.toggle("on",v))}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(!isStandalone())instShow(true)});
addEventListener("appinstalled",()=>{deferredInstall=null;instShow(false);toast(t("inst_done"))});
if(isIOS&&!isStandalone()&&/^https?:$/.test(location.protocol))instShow(true);
document.querySelectorAll(".instbtn").forEach(b=>b.addEventListener("click",async()=>{
 if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;instShow(false)}
 else if(isIOS)$("#iosM").classList.add("on")}));
$("#iosOk").addEventListener("click",()=>$("#iosM").classList.remove("on"));
licInit();
$("#appVer").textContent=APP.version;
</script>
